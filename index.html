<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny Highway Racer 3D - Showroom Intro</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #cce0ff; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      backdrop-filter: blur(12px);
      padding: 10px 20px;
      border-radius: 12px;
      color: #222;
    }
    .card-title { font-size: 11px; color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .card-val { font-size: 26px; font-weight: 800; color: #111; }

    #speedometer-container {
      position: absolute;
      bottom: 25px;
      left: 25px;
      width: 160px;
      height: 160px;
      background: rgba(18, 22, 31, 0.85);
      border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(10px);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 10;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.5s ease;
    }

    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #cce0ff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #2b4c7e;
      font-size: 22px;
      font-weight: bold;
      z-index: 200;
      transition: opacity 0.5s ease;
      text-align: center;
      padding: 20px;
    }

    #showroom-ui {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.9);
      border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2);
      backdrop-filter: blur(16px);
      padding: 40px 50px;
      text-align: center;
      border-radius: 20px;
      z-index: 100;
      color: #222;
      animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }
    #showroom-ui h1 { font-size: 34px; font-weight: 900; letter-spacing: -1px; color: #1a73e8; margin-bottom: 6px; }
    #showroom-ui p { color: #666; font-size: 14px; margin-bottom: 24px; }
    
    .primary-btn {
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 16px 40px;
      font-size: 18px;
      font-weight: 800;
      border-radius: 12px;
      cursor: pointer;
      box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
      transition: all 0.2s ease;
      letter-spacing: 0.5px;
    }
    .primary-btn:hover { background: #1557b0; transform: translateY(-2px); }

    #game-over {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ddd;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 35px 45px;
      text-align: center;
      border-radius: 16px;
      z-index: 100;
      color: #222;
    }
    #game-over h1 { color: #d93025; font-size: 32px; margin-bottom: 8px; }

    @keyframes popIn {
      0% { opacity: 0; transform: translate(-50%, -40%) scale(0.8); }
      100% { opacity: 1; transform: translate(-50%, -50%) scale(1); }
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loading-screen">
    <div id="loading-text">LOADING VEHICLE SHOWROOM...</div>
  </div>

  <div id="showroom-ui">
    <h1>SUNNY HIGHWAY</h1>
    <p>3D SHOWROOM PREVIEW</p>
    <button class="primary-btn" id="start-btn" onclick="startGame()">START DRIVE</button>
  </div>

  <div id="hud">
    <div class="card">
      <div class="card-title">Score</div>
      <div class="card-val" id="score-display">0</div>
    </div>
  </div>

  <div id="speedometer-container">
    <canvas id="speedo-canvas" width="160" height="160"></canvas>
  </div>

  <div id="game-over">
    <h1>CRASHED!</h1>
    <p style="color:#666; font-size: 14px;">FINAL SCORE</p>
    <div style="font-size: 44px; font-weight: 800; color:#1a73e8; margin: 10px 0;" id="final-score">0</div>
    <button class="primary-btn" onclick="resetGame()">DRIVE AGAIN</button>
  </div>

  <script>
    // 1. AUDIO ENGINE (Web Audio API)
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    let bgMusicInterval;

    function initAudio() {
      if (!audioCtx) audioCtx = new AudioCtx();
      if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playBgMusic() {
      initAudio();
      if (bgMusicInterval) return;

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      
      const notes = [110, 130.81, 146.83, 164.81];
      let noteIdx = 0;
      
      bgMusicInterval = setInterval(() => {
        if (!audioCtx) return;
        osc.frequency.setValueAtTime(notes[noteIdx % notes.length], audioCtx.currentTime);
        noteIdx++;
      }, 400);

      gain.gain.setValueAtTime(0.04, audioCtx.currentTime);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
    }

    function playEngineStartSound() {
      initAudio();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sawtooth';
      
      osc.frequency.setValueAtTime(60, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(240, audioCtx.currentTime + 0.4);
      osc.frequency.exponentialRampToValueAtTime(110, audioCtx.currentTime + 0.9);

      gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.9);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.9);
    }

    // 2. SCENE SETUP
    const skyColor = new THREE.Color(0xdcebff);
    const scene = new THREE.Scene();
    scene.background = skyColor;
    scene.fog = new THREE.FogExp2(0xdcebff, 0.0035);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.15;
    document.body.appendChild(renderer.domElement);

    // 3. LIGHTING
    const hemiLight = new THREE.HemisphereLight(0xd0e7ff, 0x4a6b38, 1.1);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 2.2);
    sunLight.position.set(50, 60, -40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 300;
    sunLight.shadow.bias = -0.0001;
    scene.add(sunLight);

    const sunGeo = new THREE.SphereGeometry(12, 32, 32);
    const sunMat = new THREE.MeshBasicMaterial({ color: 0xfff3d1 });
    const sunMesh = new THREE.Mesh(sunGeo, sunMat);
    sunMesh.position.set(120, 140, -400);
    scene.add(sunMesh);

    // 4. ROAD & GROUND
    const roadWidth = 22;
    const roadGeo = new THREE.PlaneGeometry(roadWidth, 2000);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x333639, roughness: 0.7, metalness: 0.1 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    scene.add(road);

    const grassGeo = new THREE.PlaneGeometry(500, 2000);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x5a8247, roughness: 0.9, metalness: 0.05 });
    const grassL = new THREE.Mesh(grassGeo, grassMat);
    grassL.position.set(-261, -0.05, 0);
    grassL.rotation.x = -Math.PI / 2;
    grassL.receiveShadow = true;
    scene.add(grassL);

    const grassR = new THREE.Mesh(grassGeo, grassMat);
    grassR.position.set(261, -0.05, 0);
    grassR.rotation.x = -Math.PI / 2;
    grassR.receiveShadow = true;
    scene.add(grassR);

    // Road Markings
    const laneMarkers = [];
    const yellowMat = new THREE.MeshBasicMaterial({ color: 0xffc400 });
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xf0f0f0 });

    for (let i = 0; i < 80; i++) {
      [-0.4, 0.4].forEach(offset => {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 8), yellowMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(offset, 0.02, -i * 25);
        scene.add(line);
        laneMarkers.push(line);
      });
      [-10.5, 10.5].forEach(x => {
        const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 8), whiteMat);
        edge.rotation.x = -Math.PI / 2;
        edge.position.set(x, 0.02, -i * 25);
        scene.add(edge);
        laneMarkers.push(edge);
      });
    }

    // 5. ENVIRONMENT
    const houseList = [];
    function createHouse(xPos, zPos) {
      const house = new THREE.Group();
      const bodyMat = new THREE.MeshStandardMaterial({ color: 0xe3dedb, roughness: 0.7 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(8, 6, 10), bodyMat);
      body.position.y = 3;
      body.castShadow = true;
      body.receiveShadow = true;
      house.add(body);

      const roofMat = new THREE.MeshStandardMaterial({ color: 0x9e382b, roughness: 0.4 });
      const roofGeo = new THREE.ConeGeometry(7.5, 4, 4);
      const roof = new THREE.Mesh(roofGeo, roofMat);
      roof.position.y = 8;
      roof.rotation.y = Math.PI / 4;
      roof.castShadow = true;
      house.add(roof);

      house.position.set(xPos, 0, zPos);
      scene.add(house);
      houseList.push(house);
    }

    for (let i = 0; i < 30; i++) {
      createHouse(-22, -i * 60);
      createHouse(22, -i * 60 - 30);
    }

    // 6. PLAYER CAR
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    let isModelLoaded = false;
    const playerWidth = 1.6;
    const playerLength = 3.6;

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load(
      './car.glb?v=' + Date.now(),
      function (gltf) {
        const model = gltf.scene;

        const bbox = new THREE.Box3().setFromObject(model);
        const size = bbox.getSize(new THREE.Vector3());
        
        const targetLength = 4.5;
        const scaleFactor = targetLength / Math.max(size.x, size.y, size.z);
        model.scale.set(scaleFactor, scaleFactor, scaleFactor);

        bbox.setFromObject(model);
        const center = bbox.getCenter(new THREE.Vector3());
        model.position.sub(center);
        model.position.y += (size.y * scaleFactor) / 2;

        model.rotation.y = Math.PI;

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        playerGroup.add(model);
        isModelLoaded = true;

        const loaderScreen = document.getElementById('loading-screen');
        loaderScreen.style.opacity = '0';
        setTimeout(() => {
          loaderScreen.style.display = 'none';
          document.getElementById('showroom-ui').style.display = 'block';
        }, 500);
      },
      function (xhr) {
        if (xhr.lengthComputable) {
          const percent = Math.round((xhr.loaded / xhr.total) * 100);
          document.getElementById('loading-text').innerText = 'LOADING ASSETS: ' + percent + '%';
        }
      },
      function (error) {
        console.error('Error loading car.glb:', error);
        document.getElementById('loading-screen').style.color = '#d93025';
        document.getElementById('loading-screen').innerHTML = '⚠️ COULD NOT LOAD MODEL<br><br><span style="font-size:14px; font-weight:normal; color:#555;">Verify <b>car.glb</b> is in your repo root.</span>';
      }
    );

    // 7. TRAFFIC OBSTACLES
    const trafficList = [];
    const lanes = [-7, -2.5, 2.5, 7];

    function createObstacle(zPos) {
      const obstacleGroup = new THREE.Group();
      
      const colors = [0xc92a2a, 0x1864ab, 0x2b8a3e, 0x495057, 0xe67700];
      const carColor = colors[Math.floor(Math.random() * colors.length)];
      
      const bodyMat = new THREE.MeshStandardMaterial({ color: carColor, metalness: 0.5, roughness: 0.3 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.2, 4.3), bodyMat);
      body.position.y = 0.6;
      body.castShadow = true;
      body.receiveShadow = true;
      obstacleGroup.add(body);

      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 2.2), cabinMat);
      cabin.position.set(0, 1.4, -0.3);
      cabin.castShadow = true;
      obstacleGroup.add(cabin);

      const initialLane = lanes[Math.floor(Math.random() * lanes.length)];
      obstacleGroup.position.set(initialLane, 0, zPos);
      
      obstacleGroup.userData = {
        speed: 0.25 + (Math.random() * 0.18),
        targetX: initialLane,
        width: 2.1,
        length: 4.3,
        changeTimer: Math.random() * 200 + 100
      };

      scene.add(obstacleGroup);
      trafficList.push(obstacleGroup);
    }

    for (let i = 0; i < 9; i++) {
      createObstacle(-60 - (i * 45));
    }

    // 8. CANVAS SPEEDOMETER
    const speedoCanvas = document.getElementById('speedo-canvas');
    const ctx = speedoCanvas.getContext('2d');

    function drawSpeedometer(currentSpeedKm) {
      const cx = 80, cy = 80, radius = 62;
      ctx.clearRect(0, 0, 160, 160);

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0.75 * Math.PI, 2.25 * Math.PI);
      ctx.lineWidth = 8;
      ctx.strokeStyle = '#2c3e50';
      ctx.stroke();

      const maxKm = 140;
      const pct = Math.min(Math.max(currentSpeedKm / maxKm, 0), 1);
      const targetAngle = 0.75 * Math.PI + (pct * 1.5 * Math.PI);

      ctx.beginPath();
      ctx.arc(cx, cy, radius, 0.75 * Math.PI, targetAngle);
      ctx.lineWidth = 8;
      ctx.strokeStyle = pct > 0.75 ? '#ff3b30' : (pct > 0.4 ? '#ffcc00' : '#34c759');
      ctx.stroke();

      for (let i = 0; i <= 10; i++) {
        const angle = 0.75 * Math.PI + (i / 10) * 1.5 * Math.PI;
        const x1 = cx + Math.cos(angle) * (radius - 12);
        const y1 = cy + Math.sin(angle) * (radius - 12);
        const x2 = cx + Math.cos(angle) * (radius - 6);
        const y2 = cy + Math.sin(angle) * (radius - 6);

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.lineWidth = i % 2 === 0 ? 2 : 1;
        ctx.strokeStyle = '#8e8e93';
        ctx.stroke();
      }

      ctx.save();
      ctx.translate(cx, cy);
      ctx.rotate(targetAngle + Math.PI / 2);
      ctx.beginPath();
      ctx.moveTo(-3, 0);
      ctx.lineTo(0, -radius + 14);
      ctx.lineTo(3, 0);
      ctx.fillStyle = '#ff3b30';
      ctx.fill();
      ctx.restore();

      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fillStyle = '#ffffff';
      ctx.fill();

      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 20px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(Math.round(currentSpeedKm), cx, cy + 32);

      ctx.fillStyle = '#8e8e93';
      ctx.font = '700 9px sans-serif';
      ctx.fillText('KM/H', cx, cy + 44);
    }

    // 9. GAME STATE & TRANSITION LOGIC
    let isGameStarted = false;
    let isTransitioning = false;
    let transitionProgress = 0;
    let isGameOver = false;

    let speed = 0;
    let score = 0;
    let steerAngle = 0;
    let cameraShake = 0;
    let showroomTime = 0;

    const maxSpeed = 0.85;
    const accel = 0.008;
    const friction = 0.985;
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', e => { if (e.code in keys) keys[e.code] = true; });
    window.addEventListener('keyup', e => { if (e.code in keys) keys[e.code] = false; });

    // Enable audio on first interaction anywhere
    window.addEventListener('click', () => {
      initAudio();
      playBgMusic();
    }, { once: true });

    function startGame() {
      if (isTransitioning || isGameStarted) return;
      
      initAudio();
      playBgMusic();
      playEngineStartSound();

      document.getElementById('showroom-ui').style.display = 'none';
      isTransitioning = true;
      transitionProgress = 0;
    }

    // 10. MAIN ANIMATION LOOP
    function animate() {
      requestAnimationFrame(animate);

      // SHOWROOM INTRO ORBIT & ZOOM MODE
      if (!isGameStarted && !isTransitioning) {
        showroomTime += 0.015;
        const radius = 7 + Math.sin(showroomTime * 0.8) * 2.5; // Smooth Zoom In & Out
        
        camera.position.x = Math.sin(showroomTime) * radius;
        camera.position.z = Math.cos(showroomTime) * radius + playerGroup.position.z;
        camera.position.y = 2.5 + Math.sin(showroomTime * 0.5) * 0.8;
        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.8, playerGroup.position.z);

        renderer.render(scene, camera);
        return;
      }

      // CINEMATIC TRANSITION FROM SHOWROOM TO GAMEPLAY
      if (isTransitioning) {
        transitionProgress += 0.02;
        
        const startCamX = camera.position.x;
        const startCamY = camera.position.y;
        const startCamZ = camera.position.z;

        const targetCamX = playerGroup.position.x;
        const targetCamY = playerGroup.position.y + 3.0;
        const targetCamZ = playerGroup.position.z + 7.5;

        camera.position.x += (targetCamX - startCamX) * 0.08;
        camera.position.y += (targetCamY - startCamY) * 0.08;
        camera.position.z += (targetCamZ - startCamZ) * 0.08;

        camera.lookAt(playerGroup.position.x, playerGroup.position.y + 0.8, playerGroup.position.z - 12);

        if (transitionProgress >= 1.0) {
          isTransitioning = false;
          isGameStarted = true;
          document.getElementById('hud').style.opacity = '1';
          document.getElementById('speedometer-container').style.opacity = '1';
        }

        renderer.render(scene, camera);
        return;
      }

      if (isGameOver) return;

      // DRIVING CONTROLS
      if (keys.ArrowUp) speed = Math.min(speed + accel, maxSpeed);
      else if (keys.ArrowDown) speed = Math.max(speed - (accel * 1.5), -maxSpeed / 3);
      else speed *= friction;

      const targetSteer = keys.ArrowLeft ? -0.35 : (keys.ArrowRight ? 0.35 : 0);
      steerAngle += (targetSteer - steerAngle) * 0.12;

      if (Math.abs(speed) > 0.005 && isModelLoaded) {
        playerGroup.position.x += steerAngle * speed * 0.8;
        playerGroup.position.x = Math.max(-9.2, Math.min(9.2, playerGroup.position.x));
        playerGroup.rotation.z = -steerAngle * 0.10;
        playerGroup.rotation.y = -steerAngle * 0.06;
      }

      playerGroup.position.z -= speed;

      // UPDATE TRAFFIC & COLLISIONS
      trafficList.forEach(t => {
        t.position.z -= t.userData.speed;

        t.userData.changeTimer--;
        if (t.userData.changeTimer <= 0) {
          t.userData.targetX = lanes[Math.floor(Math.random() * lanes.length)];
          t.userData.changeTimer = Math.random() * 180 + 90;
        }

        const xDiff = t.userData.targetX - t.position.x;
        t.position.x += xDiff * 0.035;
        t.rotation.y = -xDiff * 0.15;

        if (t.position.z > playerGroup.position.z + 20) {
          t.position.z = playerGroup.position.z - 300 - (Math.random() * 80);
          const newLane = lanes[Math.floor(Math.random() * lanes.length)];
          t.position.x = newLane;
          t.userData.targetX = newLane;
          t.userData.speed = 0.25 + (Math.random() * 0.18);
        }

        const dx = Math.abs(playerGroup.position.x - t.position.x);
        const dz = Math.abs(playerGroup.position.z - t.position.z);
        
        const minXOverlap = (playerWidth + t.userData.width * 0.7) / 2;
        const minZOverlap = (playerLength + t.userData.length * 0.7) / 2;

        if (dx < minXOverlap && dz < minZOverlap) {
          const pushDirection = playerGroup.position.x > t.position.x ? 0.6 : -0.6;
          playerGroup.position.x += pushDirection;
          playerGroup.rotation.y += pushDirection * 0.5;
          t.position.x -= pushDirection * 0.5;
          
          cameraShake = 0.8;
          triggerCrash();
        }
      });

      if (speed > 0.02) {
        score += Math.round(speed * 10);
        document.getElementById('score-display').innerText = score;
      }

      const displayKm = Math.abs(speed) * 140;
      drawSpeedometer(displayKm);

      sunLight.position.z = playerGroup.position.z - 40;
      sunMesh.position.z = playerGroup.position.z - 400;

      laneMarkers.forEach(m => {
        if (m.position.z > playerGroup.position.z + 10) m.position.z -= 1800;
      });

      houseList.forEach(h => {
        if (h.position.z > playerGroup.position.z + 30) {
          h.position.z -= 1800;
        }
      });

      // DYNAMIC GAMEPLAY CAMERA
      const targetCamX = playerGroup.position.x * 0.75;
      const targetCamY = playerGroup.position.y + 3.0 + (speed * 0.8);
      const targetCamZ = playerGroup.position.z + 7.5 + (speed * 1.5);

      camera.position.x += (targetCamX - camera.position.x) * 0.08;
      camera.position.y += (targetCamY - camera.position.y) * 0.08;
      camera.position.z += (targetCamZ - camera.position.z) * 0.08;

      if (cameraShake > 0) {
        camera.position.x += (Math.random() - 0.5) * cameraShake;
        camera.position.y += (Math.random() - 0.5) * cameraShake;
        cameraShake *= 0.85;
      }

      camera.lookAt(
        playerGroup.position.x * 0.4, 
        playerGroup.position.y + 0.8, 
        playerGroup.position.z - 12
      );

      renderer.render(scene, camera);
    }

    function triggerCrash() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'block';
    }

    function resetGame() {
      isGameOver = false;
      speed = 0;
      score = 0;
      steerAngle = 0;
      cameraShake = 0;
      document.getElementById('score-display').innerText = '0';
      document.getElementById('game-over').style.display = 'none';

      playerGroup.position.set(0, 0, 0);
      playerGroup.rotation.set(0, 0, 0);

      trafficList.forEach((t, i) => {
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        t.position.set(lane, 0, -60 - (i * 45));
        t.userData.targetX = lane;
        t.userData.speed = 0.25 + (Math.random() * 0.18);
        t.userData.changeTimer = Math.random() * 200 + 100;
      });
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
