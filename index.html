<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny Highway Racer 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #87ceeb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      z-index: 10;
      pointer-events: none;
    }
    .card {
      background: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(0, 0, 0, 0.1);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.15);
      backdrop-filter: blur(10px);
      padding: 10px 20px;
      border-radius: 10px;
      color: #222;
    }
    .card-title { font-size: 11px; color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .card-val { font-size: 26px; font-weight: 800; color: #111; }

    #loading-screen {
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #eef2f5;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      color: #333;
      font-size: 20px;
      font-weight: bold;
      z-index: 200;
      transition: opacity 0.5s ease;
    }

    #game-over {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95);
      border: 1px solid #ddd;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.25);
      padding: 35px 45px;
      text-align: center;
      border-radius: 16px;
      z-index: 100;
      color: #222;
    }
    #game-over h1 { color: #d93025; font-size: 32px; margin-bottom: 8px; }
    #restart-btn {
      margin-top: 20px;
      background: #1a73e8;
      color: #fff;
      border: none;
      padding: 12px 28px;
      font-size: 15px;
      font-weight: 600;
      border-radius: 8px;
      cursor: pointer;
      box-shadow: 0 4px 10px rgba(26, 115, 232, 0.3);
      transition: background 0.2s;
    }
    #restart-btn:hover { background: #1557b0; }
  </style>

  <!-- Three.js + GLTF Loader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loading-screen">LOADING 3D CAR...</div>

  <div id="hud">
    <div class="card">
      <div class="card-title">Speed</div>
      <div class="card-val"><span id="speed-display">0</span> <span style="font-size: 13px; font-weight: 500;">KM/H</span></div>
    </div>
    <div class="card">
      <div class="card-title">Score</div>
      <div class="card-val" id="score-display">0</div>
    </div>
  </div>

  <div id="game-over">
    <h1>CRASHED!</h1>
    <p style="color:#666; font-size: 14px;">FINAL SCORE</p>
    <div style="font-size: 44px; font-weight: 800; color:#1a73e8; margin: 10px 0;" id="final-score">0</div>
    <button id="restart-btn" onclick="resetGame()">DRIVE AGAIN</button>
  </div>

  <script>
    // 1. SCENE & ENVIRONMENT (Bright & Sunny)
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0xa0d8ef); // Sunny Sky Blue
    scene.fog = new THREE.FogExp2(0xd6eaf8, 0.005); // Soft Daylight Atmosphere

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.1;
    document.body.appendChild(renderer.domElement);

    // 2. SUNLIGHT & AMBIENT LIGHTING
    const ambientLight = new THREE.AmbientLight(0xffffff, 1.2);
    scene.add(ambientLight);

    const sunLight = new THREE.DirectionalLight(0xfffaed, 2.2); // Bright Warm Sun
    sunLight.position.set(40, 70, 40);
    sunLight.castShadow = true;
    sunLight.shadow.mapSize.width = 2048;
    sunLight.shadow.mapSize.height = 2048;
    sunLight.shadow.camera.near = 0.5;
    sunLight.shadow.camera.far = 250;
    scene.add(sunLight);

    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x8d99ae, 0.8);
    scene.add(hemiLight);

    // 3. REALISTIC ROAD & TERRAIN
    const roadWidth = 22;
    const roadGeo = new THREE.PlaneGeometry(roadWidth, 2000);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x3a3d40, roughness: 0.8 }); // Dark Asphalt
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    scene.add(road);

    // Green Grass Landscape
    const grassGeo = new THREE.PlaneGeometry(500, 2000);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x557a46, roughness: 0.9 });
    const grassL = new THREE.Mesh(grassGeo, grassMat);
    grassL.position.set(-261, -0.05, 0);
    grassL.rotation.x = -Math.PI / 2;
    scene.add(grassL);

    const grassR = new THREE.Mesh(grassGeo, grassMat);
    grassR.position.set(261, -0.05, 0);
    grassR.rotation.x = -Math.PI / 2;
    scene.add(grassR);

    // White Edge Lines & Yellow Center Lines
    const laneMarkers = [];
    const yellowMat = new THREE.MeshBasicMaterial({ color: 0xffcc00 });
    const whiteMat = new THREE.MeshBasicMaterial({ color: 0xffffff });

    // Center Double Line
    for (let i = 0; i < 80; i++) {
      [-0.4, 0.4].forEach(offset => {
        const line = new THREE.Mesh(new THREE.PlaneGeometry(0.3, 8), yellowMat);
        line.rotation.x = -Math.PI / 2;
        line.position.set(offset, 0.02, -i * 25);
        scene.add(line);
        laneMarkers.push(line);
      });
      // Outer Solid White Lines
      [-10.5, 10.5].forEach(x => {
        const edge = new THREE.Mesh(new THREE.PlaneGeometry(0.4, 8), whiteMat);
        edge.rotation.x = -Math.PI / 2;
        edge.position.set(x, 0.02, -i * 25);
        scene.add(edge);
        laneMarkers.push(edge);
      });
    }

    // Guard Rails
    const railGeo = new THREE.BoxGeometry(0.5, 1.0, 2000);
    const railMat = new THREE.MeshStandardMaterial({ color: 0xa0a5ab, metalness: 0.8, roughness: 0.3 });
    const railL = new THREE.Mesh(railGeo, railMat);
    railL.position.set(-roadWidth / 2 - 0.3, 0.5, 0);
    scene.add(railL);

    const railR = new THREE.Mesh(railGeo, railMat);
    railR.position.set(roadWidth / 2 + 0.3, 0.5, 0);
    scene.add(railR);

    // 4. PLAYER CAR (car.glb)
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    const gltfLoader = new THREE.GLTFLoader();
    gltfLoader.load(
      './car.glb',
      function (gltf) {
        const model = gltf.scene;

        const bbox = new THREE.Box3().setFromObject(model);
        const size = bbox.getSize(new THREE.Vector3());
        
        const targetLength = 4.5;
        const scaleFactor = targetLength / Math.max(size.x, size.y, size.z);
        model.scale.set(scaleFactor, scaleFactor, scaleFactor);

        bbox.setFromObject(model);
        const center = bbox.getCenter(new THREE.Vector3());
        model.position.sub(center);
        model.position.y += (size.y * scaleFactor) / 2;

        model.traverse((child) => {
          if (child.isMesh) {
            child.castShadow = true;
            child.receiveShadow = true;
          }
        });

        playerGroup.add(model);

        const loaderScreen = document.getElementById('loading-screen');
        loaderScreen.style.opacity = '0';
        setTimeout(() => loaderScreen.style.display = 'none', 500);
      },
      function (xhr) {
        if (xhr.lengthComputable) {
          const percent = (xhr.loaded / xhr.total) * 100;
          document.getElementById('loading-screen').innerText = 'LOADING 3D CAR: ' + Math.round(percent) + '%';
        }
      },
      function (error) {
        console.error('Error loading car.glb:', error);
        document.getElementById('loading-screen').innerText = 'Error: Make sure car.glb is uploaded to repository root!';
      }
    );

    // 5. TRAFFIC VEHICLES
    const trafficList = [];
    const lanes = [-7, -2.5, 2.5, 7];

    function createObstacle(zPos) {
      const obstacleGroup = new THREE.Group();
      
      const colors = [0xd93025, 0x1a73e8, 0x34a853, 0x5f6368, 0xfbbc04];
      const carColor = colors[Math.floor(Math.random() * colors.length)];
      
      const bodyMat = new THREE.MeshStandardMaterial({ color: carColor, metalness: 0.6, roughness: 0.3 });
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.1, 1.2, 4.3), bodyMat);
      body.position.y = 0.6;
      body.castShadow = true;
      obstacleGroup.add(body);

      const cabinMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.1 });
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.8, 2.2), cabinMat);
      cabin.position.set(0, 1.4, -0.3);
      cabin.castShadow = true;
      obstacleGroup.add(cabin);

      const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
      obstacleGroup.position.set(randomLane, 0, zPos);

      scene.add(obstacleGroup);
      trafficList.push(obstacleGroup);
    }

    for (let i = 0; i < 9; i++) {
      createObstacle(-60 - (i * 40));
    }

    // 6. CONTROLS & PHYSICS
    let speed = 0;
    let score = 0;
    let isGameOver = false;
    let steerAngle = 0;

    const maxSpeed = 1.6;
    const accel = 0.03;
    const friction = 0.96;
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', e => { if (e.code in keys) keys[e.code] = true; });
    window.addEventListener('keyup', e => { if (e.code in keys) keys[e.code] = false; });

    // 7. GAME ANIMATION LOOP
    function animate() {
      if (isGameOver) return;
      requestAnimationFrame(animate);

      if (keys.ArrowUp) speed = Math.min(speed + accel, maxSpeed);
      else if (keys.ArrowDown) speed = Math.max(speed - accel, -maxSpeed / 2);
      else speed *= friction;

      const targetSteer = keys.ArrowLeft ? 0.35 : (keys.ArrowRight ? -0.35 : 0);
      steerAngle += (targetSteer - steerAngle) * 0.15;

      if (Math.abs(speed) > 0.01) {
        playerGroup.position.x += steerAngle * speed * 0.75;
        playerGroup.position.x = Math.max(-9.2, Math.min(9.2, playerGroup.position.x));
        playerGroup.rotation.z = steerAngle * 0.10;
        playerGroup.rotation.y = steerAngle * 0.06;
      }

      playerGroup.position.z -= speed;

      if (speed > 0.05) {
        score += Math.round(speed * 15);
        document.getElementById('score-display').innerText = score;
      }
      document.getElementById('speed-display').innerText = Math.round(Math.abs(speed) * 180);

      // Track recycling
      laneMarkers.forEach(m => {
        if (m.position.z > playerGroup.position.z + 10) m.position.z -= 1800;
      });

      // Traffic recycling & collision
      trafficList.forEach(t => {
        if (t.position.z > playerGroup.position.z + 15) {
          t.position.z = playerGroup.position.z - 300 - (Math.random() * 80);
          t.position.x = lanes[Math.floor(Math.random() * lanes.length)];
        }

        const dx = Math.abs(playerGroup.position.x - t.position.x);
        const dz = Math.abs(playerGroup.position.z - t.position.z);

        if (dx < 1.9 && dz < 4.0) {
          triggerCrash();
        }
      });

      // Smooth Camera Follow
      camera.position.x += (playerGroup.position.x - camera.position.x) * 0.1;
      camera.position.y = playerGroup.position.y + 3.2;
      camera.position.z = playerGroup.position.z + 8.0;
      camera.lookAt(playerGroup.position.x * 0.5, playerGroup.position.y + 0.8, playerGroup.position.z - 10);

      renderer.render(scene, camera);
    }

    function triggerCrash() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'block';
    }

    function resetGame() {
      isGameOver = false;
      speed = 0;
      score = 0;
      steerAngle = 0;
      document.getElementById('score-display').innerText = '0';
      document.getElementById('game-over').style.display = 'none';

      playerGroup.position.set(0, 0, 0);
      playerGroup.rotation.set(0, 0, 0);

      trafficList.forEach((t, i) => {
        t.position.set(lanes[Math.floor(Math.random() * lanes.length)], 0, -60 - (i * 45));
      });

      animate();
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
