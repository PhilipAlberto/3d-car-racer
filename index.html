<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Racing Engine - Philip Dare-Johnson</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #111;
            color: #fff;
            font-family: Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .game-window {
            position: relative;
            width: 800px;
            height: 520px;
            background-color: #0b0b0b;
            border: 4px solid #333;
            border-radius: 8px;
            box-shadow: 0 0 25px rgba(0, 0, 0, 0.9);
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .header-bar {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 10px 20px;
            box-sizing: border-box;
            background: #1c1c1c;
            border-bottom: 2px solid #333;
            font-size: 16px;
        }
        .canvas-container {
            position: relative;
            width: 800px;
            height: 450px;
        }
        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(14, 14, 14, 0.96);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
        }
        #pauseOverlay {
            background: rgba(0, 0, 0, 0.75);
            font-size: 28px;
            font-weight: bold;
            letter-spacing: 2px;
            display: none;
        }
        #pauseOverlay span {
            font-size: 14px;
            font-weight: normal;
            color: #aaa;
            margin-top: 10px;
        }
        h1 {
            margin: 0 0 10px 0;
            font-size: 28px;
            color: #4CAF50;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .form-group {
            margin-bottom: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        label {
            font-size: 14px;
            margin-bottom: 5px;
            color: #ccc;
        }
        input[type="text"] {
            padding: 8px 12px;
            font-size: 14px;
            border: 2px solid #444;
            border-radius: 4px;
            background: #222;
            color: #fff;
            text-align: center;
            outline: none;
        }
        input[type="text"]:focus {
            border-color: #4CAF50;
        }
        .high-score-display {
            font-size: 14px;
            color: #ffeb3b;
            margin-bottom: 15px;
            text-align: center;
            line-height: 1.4;
        }
        .settings-panel {
            margin-bottom: 15px;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 14px;
            color: #ddd;
        }
        button {
            padding: 10px 30px;
            font-size: 16px;
            font-weight: bold;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            box-shadow: 0 4px #2e6b31;
            transition: 0.1s;
        }
        button:active {
            box-shadow: 0 0 #2e6b31;
            transform: translateY(4px);
        }
        #controls {
            margin-top: 10px;
            display: none;
        }
        .courtesy {
            position: absolute;
            bottom: 10px;
            font-size: 11px;
            color: #555;
            letter-spacing: 1px;
        }
    </style>
    <!-- Three.js + GLTFLoader -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

    <div class="game-window">
        <div class="header-bar">
            <div id="playerDisplay">Player: ---</div>
            <div id="scoreBoard">Score: 0</div>
        </div>

        <div class="canvas-container">
            <div id="webglContainer" style="width: 100%; height: 100%;"></div>

            <!-- MENU OVERLAY -->
            <div id="menuOverlay" class="overlay">
                <h1>3D Racing Engine</h1>
                
                <div class="form-group" id="nameInputGroup">
                    <label for="playerName">Enter Your Name</label>
                    <input type="text" id="playerName" placeholder="Player Name" maxlength="12" value="Philson">
                </div>

                <div class="high-score-display" id="highScoreText">
                    Highest Score: None
                </div>

                <div class="settings-panel">
                    <label for="soundToggle">🔊 Sound Effects:</label>
                    <input type="checkbox" id="soundToggle" checked>
                </div>

                <button id="startBtn">Start Game</button>
                
                <div class="courtesy">courtesy: Philson</div>
            </div>

            <!-- PAUSE OVERLAY -->
            <div id="pauseOverlay" class="overlay">
                <div>PAUSED</div>
                <span>Press Spacebar to Resume</span>
            </div>
        </div>
    </div>

    <div id="controls">
        <button id="pauseBtn">Pause</button>
    </div>

    <script>
        // --- UI Element Selectors ---
        const menuOverlay = document.getElementById("menuOverlay");
        const pauseOverlay = document.getElementById("pauseOverlay");
        const highScoreText = document.getElementById("highScoreText");
        const soundToggle = document.getElementById("soundToggle");
        const startBtn = document.getElementById("startBtn");
        const pauseBtn = document.getElementById("pauseBtn");
        const controlsDiv = document.getElementById("controls");
        const playerNameInput = document.getElementById("playerName");
        const playerDisplay = document.getElementById("playerDisplay");
        const scoreBoard = document.getElementById("scoreBoard");

        // --- Game State Variables ---
        let gameState = 'MENU';
        let currentPlayerName = "";
        let soundEnabled = true;
        let score = 0;
        let audioCtx = null;

        // --- Key Event Listeners ---
        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
        window.addEventListener('keydown', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = true;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = true;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = true;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = true;
            if (e.code === 'Space') {
                if (gameState === 'PLAYING') togglePause();
                else if (gameState === 'PAUSED') togglePause();
            }
        });
        window.addEventListener('keyup', (e) => {
            if (e.code === 'ArrowLeft' || e.code === 'KeyA') keys.ArrowLeft = false;
            if (e.code === 'ArrowRight' || e.code === 'KeyD') keys.ArrowRight = false;
            if (e.code === 'ArrowUp' || e.code === 'KeyW') keys.ArrowUp = false;
            if (e.code === 'ArrowDown' || e.code === 'KeyS') keys.ArrowDown = false;
        });

        // --- Sound Engine ---
        function initAudio() {
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!soundEnabled) return;
            initAudio();
            try {
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                if (type === 'score') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                    osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.1);
                    gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.15);
                } else if (type === 'crash') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                    osc.frequency.linearRampToValueAtTime(40, audioCtx.currentTime + 0.4);
                    gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                    gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
                    osc.start();
                    osc.stop(audioCtx.currentTime + 0.4);
                }
            } catch (e) {}
        }

        // --- High Score Management ---
        function updateHighScoreDisplay() {
            const high = localStorage.getItem("racing_high_score") || 0;
            const holder = localStorage.getItem("racing_high_holder") || "None";
            highScoreText.innerHTML = `Highest Score: ${high}<br>(by ${holder})`;
        }
        updateHighScoreDisplay();

        // --- WebGL / Three.js Pipeline ---
        const container = document.getElementById('webglContainer');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x111115);

        const camera = new THREE.PerspectiveCamera(60, 800 / 450, 0.1, 1000);
        camera.position.set(0, 3.2, 7.5);
        camera.lookAt(0, 1, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(800, 450);
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        // --- Simple Direct Lighting ---
        const ambientLight = new THREE.AmbientLight(0xffffff, 1.0);
        scene.add(ambientLight);

        const dirLight = new THREE.DirectionalLight(0xffffff, 1.2);
        dirLight.position.set(10, 30, 15);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // --- Looping Road & Boundary Walls ---
        const roadWidth = 10;
        const tileLength = 40;
        const numTiles = 7;
        const roadTiles = [];
        const obstacles = [];

        function createRoadSegment(zPos) {
            const group = new THREE.Group();
            
            const roadGeo = new THREE.PlaneGeometry(roadWidth, tileLength);
            const roadMat = new THREE.MeshStandardMaterial({ color: 0x1f1f24, roughness: 0.9 });
            const roadMesh = new THREE.Mesh(roadGeo, roadMat);
            roadMesh.rotation.x = -Math.PI / 2;
            roadMesh.receiveShadow = true;
            group.add(roadMesh);

            const wallGeo = new THREE.BoxGeometry(0.5, 1.2, tileLength);
            const wallMat = new THREE.MeshStandardMaterial({ color: 0x33333d, metalness: 0.2 });
            
            const leftWall = new THREE.Mesh(wallGeo, wallMat);
            leftWall.position.set(-roadWidth / 2 - 0.25, 0.6, 0);
            leftWall.castShadow = true;
            group.add(leftWall);

            const rightWall = new THREE.Mesh(wallGeo, wallMat);
            rightWall.position.set(roadWidth / 2 + 0.25, 0.6, 0);
            rightWall.castShadow = true;
            group.add(rightWall);

            group.position.z = zPos;
            scene.add(group);
            return group;
        }

        for (let i = 0; i < numTiles; i++) {
            roadTiles.push(createRoadSegment(-i * tileLength));
        }

        // --- Load Local car.glb (Facing Forward) ---
        const playerCar = new THREE.Group();
        scene.add(playerCar);
        playerCar.boundingBox = new THREE.Box3();

        const loader = new THREE.GLTFLoader();
        loader.load('./car.glb', (gltf) => {
            const model = gltf.scene;
            
            // Rotate 180 degrees so it faces forward down the track
            model.rotation.y = Math.PI;

            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 3.0 / maxDim;
            model.scale.set(scale, scale, scale);

            model.traverse((child) => {
                if (child.isMesh) child.castShadow = true;
            });

            playerCar.add(model);
        }, undefined, (error) => {
            console.warn("car.glb not found locally, using fallback geometry.", error);
            const fallbackGeo = new THREE.BoxGeometry(1.6, 0.6, 3.2);
            const fallbackMat = new THREE.MeshStandardMaterial({ color: 0x4CAF50 });
            const fallbackMesh = new THREE.Mesh(fallbackGeo, fallbackMat);
            fallbackMesh.rotation.y = Math.PI;
            playerCar.add(fallbackMesh);
        });

        // --- Obstacles Generator ---
        function createObstacle() {
            const geo = new THREE.BoxGeometry(1.4, 1.2, 1.4);
            const mat = new THREE.MeshStandardMaterial({ color: 0xff3b30, metalness: 0.3 });
            const mesh = new THREE.Mesh(geo, mat);
            mesh.castShadow = true;
            
            const lanes = [-3, 0, 3];
            mesh.position.x = lanes[Math.floor(Math.random() * lanes.length)];
            mesh.position.y = 0.6;
            mesh.position.z = -140 - Math.random() * 40;
            
            mesh.boundingBox = new THREE.Box3();
            scene.add(mesh);
            obstacles.push(mesh);
        }

        // --- Game Loop Control ---
        let carX = 0;
        let carSpeed = 0.6;
        const carMaxSpeed = 1.4;
        const boundsX = (roadWidth / 2) - 1.0;

        function resetGame() {
            score = 0;
            carX = 0;
            carSpeed = 0.6;
            playerCar.position.set(0, 0, 0);

            obstacles.forEach(obs => scene.remove(obs));
            obstacles.length = 0;

            for (let i = 0; i < 3; i++) {
                createObstacle();
            }
        }

        function togglePause() {
            if (gameState === 'PLAYING') {
                gameState = 'PAUSED';
                pauseOverlay.style.display = 'flex';
            } else if (gameState === 'PAUSED') {
                gameState = 'PLAYING';
                pauseOverlay.style.display = 'none';
            }
        }

        startBtn.addEventListener('click', () => {
            const nameVal = playerNameInput.value.trim() || "Philson";
            currentPlayerName = nameVal;
            playerDisplay.textContent = `Player: ${nameVal}`;
            
            soundEnabled = soundToggle.checked;
            menuOverlay.style.display = 'none';
            controlsDiv.style.display = 'block';
            
            resetGame();
            gameState = 'PLAYING';
        });

        pauseBtn.addEventListener('click', togglePause);

        // --- Main Render & Logic Loop ---
        function animate() {
            requestAnimationFrame(animate);

            if (gameState === 'PLAYING') {
                if (keys.ArrowLeft) carX -= 0.12;
                if (keys.ArrowRight) carX += 0.12;
                if (keys.ArrowUp) carSpeed = Math.min(carSpeed + 0.01, carMaxSpeed);
                if (keys.ArrowDown) carSpeed = Math.max(carSpeed - 0.02, 0.3);

                carX = Math.max(-boundsX, Math.min(boundsX, carX));
                playerCar.position.x = carX;
                // Keep the 180° orientation while leaning on turn
                playerCar.rotation.y = Math.PI - (carX - playerCar.position.x) * 0.15;
                
                playerCar.boundingBox.setFromObject(playerCar);

                roadTiles.forEach(tile => {
                    tile.position.z += carSpeed * 10;
                    if (tile.position.z > tileLength) {
                        tile.position.z -= numTiles * tileLength;
                    }
                });

                obstacles.forEach(obs => {
                    obs.position.z += carSpeed * 10;
                    obs.boundingBox.setFromObject(obs);

                    if (playerCar.boundingBox.intersectsBox(obs.boundingBox)) {
                        playSound('crash');
                        gameState = 'MENU';
                        menuOverlay.style.display = 'flex';
                        controlsDiv.style.display = 'none';

                        const currentHigh = parseInt(localStorage.getItem("racing_high_score") || "0");
                        if (score > currentHigh) {
                            localStorage.setItem("racing_high_score", score);
                            localStorage.setItem("racing_high_holder", currentPlayerName);
                            updateHighScoreDisplay();
                        }
                    }

                    if (obs.position.z > 10) {
                        obs.position.z = -140 - Math.random() * 30;
                        const lanes = [-3, 0, 3];
                        obs.position.x = lanes[Math.floor(Math.random() * lanes.length)];
                        
                        score += 10;
                        scoreBoard.textContent = `Score: ${score}`;
                        playSound('score');
                    }
                });
            }

            renderer.render(scene, camera);
        }

        animate();
    </script>
</body>
</html>
