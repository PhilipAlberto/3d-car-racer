<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Competitive AI Vehicle Racer 3D</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #1a1a24; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

    /* HUD Elements */
    #hud {
      position: absolute; top: 20px; left: 20px; display: flex; gap: 12px; z-index: 10;
      pointer-events: none; opacity: 0; transition: opacity 0.5s;
    }
    .hud-card {
      background: rgba(18, 22, 31, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(10px); padding: 12px 20px; border-radius: 12px; color: #fff;
    }
    .hud-label { font-size: 10px; color: #8a99ad; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .hud-value { font-size: 24px; font-weight: 900; color: #38ef7d; }

    /* Rotation Calibration Toolbar */
    #toolbar {
      position: absolute; bottom: 20px; right: 20px; z-index: 100;
      background: rgba(0,0,0,0.85); border: 1px solid #333; padding: 10px 15px; border-radius: 10px;
      color: #fff; display: flex; gap: 10px; align-items: center; font-size: 12px;
    }
    .tool-btn {
      background: #2a2f3a; color: #fff; border: 1px solid #444; padding: 6px 12px;
      border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 11px;
    }
    .tool-btn:hover { background: #3b4252; }

    /* Garage & UI Screens */
    #garage-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(15, 18, 25, 0.85); backdrop-filter: blur(12px);
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 50; color: #fff; text-align: center;
    }
    h1 { font-size: 42px; font-weight: 900; letter-spacing: 2px; margin-bottom: 5px; color: #fff; }
    p.subtitle { color: #8a99ad; font-size: 14px; margin-bottom: 30px; }

    .selector-box { display: flex; align-items: center; gap: 20px; margin-bottom: 30px; }
    .nav-arrow {
      background: #222834; color: #fff; border: 1px solid #3a4253; width: 50px; height: 50px;
      border-radius: 50%; font-size: 22px; cursor: pointer; transition: 0.2s;
    }
    .nav-arrow:hover { background: #11998e; border-color: #38ef7d; }
    .car-title { font-size: 22px; font-weight: 800; min-width: 180px; color: #38ef7d; }

    .btn-start {
      background: linear-gradient(135deg, #11998e, #38ef7d); color: #000; border: none;
      padding: 16px 48px; font-size: 18px; font-weight: 900; border-radius: 30px;
      cursor: pointer; box-shadow: 0 8px 25px rgba(56, 239, 125, 0.4); transition: 0.2s;
    }
    .btn-start:hover { transform: scale(1.05); }

    /* Game Over */
    #game-over {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(20, 20, 30, 0.95); border: 1px solid #e53935; box-shadow: 0 0 50px rgba(229, 57, 53, 0.4);
      padding: 40px 60px; text-align: center; border-radius: 20px; z-index: 100; color: #fff;
    }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div id="hud">
    <div class="hud-card">
      <div class="hud-label">Speed</div>
      <div class="hud-value" id="speed-val">0 KM/H</div>
    </div>
    <div class="hud-card">
      <div class="hud-label">Score</div>
      <div class="hud-value" id="score-val">0</div>
    </div>
  </div>

  <div id="toolbar">
    <span>Orientation Fix:</span>
    <button class="tool-btn" onclick="rotateCarY(90)">Turn +90°</button>
    <button class="tool-btn" onclick="rotateCarY(180)">Turn 180°</button>
    <button class="tool-btn" onclick="rotateCarY(-90)">Turn -90°</button>
  </div>

  <div id="garage-screen">
    <h1>HIGHWAY AI RACER</h1>
    <p class="subtitle">SELECT YOUR VEHICLE & DRIVE</p>

    <div class="selector-box">
      <button class="nav-arrow" onclick="switchCar(-1)">&#10094;</button>
      <div class="car-title" id="car-name-display">Car (1)</div>
      <button class="nav-arrow" onclick="switchCar(1)">&#10095;</button>
    </div>

    <button class="btn-start" onclick="launchGame()">RACE NOW</button>
  </div>

  <div id="game-over">
    <h1 style="color: #e53935;">CRASHED!</h1>
    <p class="subtitle" style="margin-bottom: 15px;">TOTAL DISTANCE SCORE</p>
    <div style="font-size: 48px; font-weight: 900; color: #38ef7d; margin-bottom: 25px;" id="final-score">0</div>
    <button class="btn-start" onclick="restartGame()">TRY AGAIN</button>
  </div>

  <script>
    // Asset Repository Manifest
    const manifest = {
      cars: ['Car (1).glb', 'Car (3).glb', 'Car (6).glb', 'Car (7).glb', 'car.glb'],
      traffic: ['T-vehicle (1).glb', 'T-vehicle (2).glb', 'T-vehicle (3).glb'],
      buildings: ['Building (1).glb', 'Building (2).glb', 'Building (3).glb', 'Building (4).glb', 'Building (5).glb', 'Building (10).glb', 'Building (12).glb', 'Building (20).glb'],
      trees: ['Tree (2).glb', 'Tree (3).glb', 'Tree (4).glb', 'Tree (5).glb', 'Tree (6).glb', 'Tree (8).glb'],
      planes: ['Aeroplane (1).glb', 'Aeroplane (2).glb', 'Aeroplane (3).glb']
    };

    let userYRotationOffset = 0; // Fixes direction across exported files
    let selectedCarIndex = 0;
    const loadedPlayerCars = {};

    // Scene Setup
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0025);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    container.appendChild(renderer.domElement);

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfffaed, 1.5);
    sun.position.set(50, 100, -50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    // Procedural Fallback Meshes
    function makeFallbackCar(color=0xd32f2f) {
      const g = new THREE.Group();
      const body = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 4.2), new THREE.MeshStandardMaterial({color: color, roughness: 0.3}));
      body.position.y = 0.8; body.castShadow = true; g.add(body);
      const cabin = new THREE.Mesh(new THREE.BoxGeometry(1.6, 0.9, 2), new THREE.MeshStandardMaterial({color: 0x111111, roughness: 0.1}));
      cabin.position.set(0, 1.6, -0.2); cabin.castShadow = true; g.add(cabin);
      return g;
    }

    function makeFallbackBuilding() {
      const h = 15 + Math.random() * 25;
      const b = new THREE.Mesh(new THREE.BoxGeometry(10, h, 10), new THREE.MeshStandardMaterial({color: 0x455a64, roughness: 0.5}));
      b.position.y = h / 2; b.castShadow = true; b.receiveShadow = true;
      return b;
    }

    function makeFallbackTree() {
      const g = new THREE.Group();
      const trunk = new THREE.Mesh(new THREE.CylinderGeometry(0.4, 0.6, 3), new THREE.MeshStandardMaterial({color: 0x5d4037}));
      trunk.position.y = 1.5; g.add(trunk);
      const leaves = new THREE.Mesh(new THREE.ConeGeometry(2.5, 6, 8), new THREE.MeshStandardMaterial({color: 0x2e7d32}));
      leaves.position.y = 4.5; leaves.castShadow = true; g.add(leaves);
      return g;
    }

    // Model Processing & Normalization
    const gltfLoader = new THREE.GLTFLoader();

    function normalizeModel(model, targetLength = 4.5) {
      const wrapper = new THREE.Group();
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());

      const maxDim = Math.max(size.x, size.y, size.z);
      const scale = targetLength / maxDim;
      model.scale.set(scale, scale, scale);

      // Re-center around origin and ground alignment
      box.setFromObject(model);
      box.getCenter(center);
      model.position.x = -center.x;
      model.position.z = -center.z;
      model.position.y = -box.min.y;

      model.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
      wrapper.add(model);
      return wrapper;
    }

    // Player Group Setup
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);

    manifest.cars.forEach((file, idx) => {
      gltfLoader.load(`./${file}`, 
        (gltf) => {
          const norm = normalizeModel(gltf.scene, 4.5);
          loadedPlayerCars[idx] = norm;
          if (idx === 0) playerGroup.add(norm);
        },
        undefined,
        () => {
          const fallback = normalizeModel(makeFallbackCar(0x1976d2), 4.5);
          loadedPlayerCars[idx] = fallback;
          if (idx === 0) playerGroup.add(fallback);
        }
      );
    });

    function switchCar(dir) {
      if (loadedPlayerCars[selectedCarIndex]) playerGroup.remove(loadedPlayerCars[selectedCarIndex]);
      selectedCarIndex = (selectedCarIndex + dir + manifest.cars.length) % manifest.cars.length;
      if (loadedPlayerCars[selectedCarIndex]) playerGroup.add(loadedPlayerCars[selectedCarIndex]);
      document.getElementById('car-name-display').innerText = manifest.cars[selectedCarIndex].replace('.glb', '');
    }

    function rotateCarY(deg) {
      userYRotationOffset += (deg * Math.PI / 180);
      playerGroup.rotation.y = userYRotationOffset;
    }

    // Endless Road & Highway World Creation
    const roadWidth = 20, chunkLen = 100, totalChunks = 15;
    const roadChunks = [];

    const roadGeo = new THREE.PlaneGeometry(roadWidth, chunkLen);
    roadGeo.rotateX(-Math.PI / 2);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x22252a, roughness: 0.8 });

    const grassGeo = new THREE.PlaneGeometry(300, chunkLen);
    grassGeo.rotateX(-Math.PI / 2);
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x43a047, roughness: 0.9 });

    for (let i = 0; i < totalChunks; i++) {
      const group = new THREE.Group();
      
      const road = new THREE.Mesh(roadGeo, roadMat);
      road.receiveShadow = true; group.add(road);

      const grass = new THREE.Mesh(grassGeo, grassMat);
      grass.position.y = -0.05; grass.receiveShadow = true; group.add(grass);

      group.position.z = -i * chunkLen;
      scene.add(group);
      roadChunks.push(group);
    }

    // Competitive AI Traffic System
    const aiVehicles = [];
    const lanes = [-6.5, -2.2, 2.2, 6.5];

    function spawnAIVehicle(zPos) {
      const aiGroup = new THREE.Group();
      const randFile = manifest.traffic[Math.floor(Math.random() * manifest.traffic.length)];

      gltfLoader.load(`./${randFile}`,
        (gltf) => { aiGroup.add(normalizeModel(gltf.scene, 4.2)); },
        undefined,
        () => { aiGroup.add(normalizeModel(makeFallbackCar(0xd32f2f), 4.2)); }
      );

      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      aiGroup.position.set(lane, 0, zPos);
      aiGroup.userData = {
        speed: 0.4 + Math.random() * 0.3,
        lane: lane,
        targetX: lane,
        changeTimer: Math.random() * 200
      };

      scene.add(aiGroup);
      aiVehicles.push(aiGroup);
    }

    for (let i = 0; i < 10; i++) spawnAIVehicle(-50 - (i * 45));

    // Scenery Props Manager (Buildings, Trees, Pedestrians)
    const sceneryProps = [];

    function spawnSceneryItem(fileList, fallbackFn, xPos, zPos) {
      const itemGroup = new THREE.Group();
      const file = fileList[Math.floor(Math.random() * fileList.length)];

      gltfLoader.load(`./${file}`,
        (gltf) => { itemGroup.add(normalizeModel(gltf.scene, 8 + Math.random() * 12)); },
        undefined,
        () => { itemGroup.add(fallbackFn()); }
      );

      itemGroup.position.set(xPos, 0, zPos);
      scene.add(itemGroup);
      sceneryProps.push(itemGroup);
    }

    for (let i = 0; i < 20; i++) {
      spawnSceneryItem(manifest.buildings, makeFallbackBuilding, -24, -i * 50);
      spawnSceneryItem(manifest.buildings, makeFallbackBuilding, 24, -i * 50 - 25);
      spawnSceneryItem(manifest.trees, makeFallbackTree, -14, -i * 30);
      spawnSceneryItem(manifest.trees, makeFallbackTree, 14, -i * 30 - 15);
    }

    // Overhead Planes
    const planes = [];
    function spawnAirplane() {
      const planeGroup = new THREE.Group();
      const file = manifest.planes[Math.floor(Math.random() * manifest.planes.length)];
      gltfLoader.load(`./${file}`, (gltf) => {
        planeGroup.add(normalizeModel(gltf.scene, 15));
        planeGroup.position.set(120, 50, playerGroup.position.z - 300);
        scene.add(planeGroup);
        planes.push(planeGroup);
      });
    }
    setInterval(spawnAirplane, 15000);

    // Driving Engine & AI Loop
    let isPlaying = false, isGameOver = false;
    let speed = 0, score = 0, sideSpeed = 0;
    const keys = {};

    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function launchGame() {
      document.getElementById('garage-screen').style.display = 'none';
      document.getElementById('hud').style.opacity = '1';
      isPlaying = true;
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!isPlaying) {
        // Garage orbit mode
        const t = Date.now() * 0.001;
        camera.position.set(Math.sin(t) * 9, 3, Math.cos(t) * 9 + playerGroup.position.z);
        camera.lookAt(playerGroup.position.x, 1, playerGroup.position.z);
        renderer.render(scene, camera);
        return;
      }

      if (isGameOver) return;

      // Player Physics
      const accel = 0.015, decel = 0.02, maxSpeed = 1.8;
      if (keys['ArrowUp'] || keys['KeyW']) speed = Math.min(speed + accel, maxSpeed);
      else if (keys['ArrowDown'] || keys['KeyS']) speed = Math.max(speed - decel, -0.4);
      else speed *= 0.98;

      if (keys['ArrowLeft'] || keys['KeyA']) sideSpeed = -0.25;
      else if (keys['ArrowRight'] || keys['KeyD']) sideSpeed = 0.25;
      else sideSpeed = 0;

      playerGroup.position.x += sideSpeed;
      playerGroup.position.x = Math.max(-8.5, Math.min(8.5, playerGroup.position.x));
      playerGroup.position.z -= speed;

      // Base yaw handling + manual offset fix
      playerGroup.rotation.y = userYRotationOffset + (-sideSpeed * 0.2);

      // Endless Track Loop Recycling
      roadChunks.forEach(chunk => {
        if (chunk.position.z > playerGroup.position.z + 50) {
          chunk.position.z -= totalChunks * chunkLen;
        }
      });

      // AI Logic & Lane Swapping Engine
      aiVehicles.forEach(ai => {
        ai.position.z -= ai.userData.speed;

        // Competitive AI decision making
        ai.userData.changeTimer--;
        if (ai.userData.changeTimer <= 0) {
          ai.userData.changeTimer = 150 + Math.random() * 200;
          const nextLane = lanes[Math.floor(Math.random() * lanes.length)];
          ai.userData.targetX = nextLane;
        }

        // Smooth AI lane transitioning
        ai.position.x += (ai.userData.targetX - ai.position.x) * 0.05;

        // Recycle AI vehicles forward
        if (ai.position.z > playerGroup.position.z + 30) {
          ai.position.z = playerGroup.position.z - 350 - (Math.random() * 100);
          ai.position.x = lanes[Math.floor(Math.random() * lanes.length)];
          ai.userData.targetX = ai.position.x;
        }

        // Collision Check
        const dx = Math.abs(playerGroup.position.x - ai.position.x);
        const dz = Math.abs(playerGroup.position.z - ai.position.z);
        if (dx < 1.8 && dz < 3.8) {
          triggerCrash();
        }
      });

      // Recycle Scenery Props
      sceneryProps.forEach(prop => {
        if (prop.position.z > playerGroup.position.z + 50) {
          prop.position.z -= 1000;
        }
      });

      // Update Overhead Planes
      planes.forEach((plane, idx) => {
        plane.position.x -= 1.0;
        plane.position.z -= 0.6;
        if (plane.position.x < -200) {
          scene.remove(plane);
          planes.splice(idx, 1);
        }
      });

      // Score & HUD
      if (speed > 0) score += Math.round(speed * 10);
      document.getElementById('speed-val').innerText = `${Math.round(Math.abs(speed) * 120)} KM/H`;
      document.getElementById('score-val').innerText = score;

      // Smooth Third-Person Camera Tracking
      const camTargetX = playerGroup.position.x * 0.6;
      const camTargetY = 3.5 + (speed * 0.4);
      const camTargetZ = playerGroup.position.z + 9 + (speed * 0.8);

      camera.position.x += (camTargetX - camera.position.x) * 0.1;
      camera.position.y += (camTargetY - camera.position.y) * 0.1;
      camera.position.z += (camTargetZ - camera.position.z) * 0.1;
      camera.lookAt(playerGroup.position.x * 0.2, 1, playerGroup.position.z - 10);

      renderer.render(scene, camera);
    }

    function triggerCrash() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'block';
    }

    function restartGame() {
      isGameOver = false; speed = 0; score = 0;
      document.getElementById('game-over').style.display = 'none';
      playerGroup.position.set(0, 0, 0);
      aiVehicles.forEach((ai, i) => {
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        ai.position.set(lane, 0, -60 - i * 50);
        ai.userData.targetX = lane;
      });
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
