<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D World Asset & Environment Viewer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; }
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
    
    #hud {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(8px); padding: 14px 20px; border-radius: 12px; color: #fff;
    }
    #hud h1 { font-size: 16px; color: #38ef7d; margin-bottom: 4px; }
    #hud p { font-size: 12px; color: #94a3b8; }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>
  <div id="hud">
    <h1>3D World Viewer</h1>
    <p>Left Click: Rotate | Right Click: Pan | Scroll: Zoom</p>
  </div>

  <script>
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    camera.position.set(0, 20, 50);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.shadowMap.enabled = true;
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Lights
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.9);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(50, 80, 50);
    sun.castShadow = true;
    scene.add(sun);

    // FIXED: Ground Plane
    const groundGeo = new THREE.PlaneGeometry(500, 500);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x334155, roughness: 0.8 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.rotation.x = -Math.PI / 2;
    ground.position.y = 0;
    ground.receiveShadow = true;
    scene.add(ground);

    // FIXED: Road Mesh (Elevated Y = 0.05 to prevent invisible/Z-fighting rendering)
    const roadGeo = new THREE.PlaneGeometry(24, 500);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.5 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.05; 
    road.receiveShadow = true;
    scene.add(road);

    // Lane Markings
    const lineGeo = new THREE.PlaneGeometry(0.8, 500);
    const lineMat = new THREE.MeshStandardMaterial({ color: 0xfacc15 });
    const line = new THREE.Mesh(lineGeo, lineMat);
    line.rotation.x = -Math.PI / 2;
    line.position.y = 0.06;
    scene.add(line);

    // Animation System setup
    const animationMixers = [];
    const gltfLoader = new THREE.GLTFLoader();

    function loadAnimatedModel(path, posX, posZ) {
      gltfLoader.load(path, (gltf) => {
        const model = gltf.scene;
        model.position.set(posX, 0.05, posZ);
        
        // Scale normalize
        const box = new THREE.Box3().setFromObject(model);
        const size = box.getSize(new THREE.Vector3());
        if (size.y > 0) {
          const s = 4 / size.y;
          model.scale.set(s, s, s);
        }
        
        scene.add(model);

        // FIXED: Play all embedded skeletal clip animations
        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(model);
          gltf.animations.forEach((clip) => {
            const action = mixer.clipAction(clip);
            action.play();
          });
          animationMixers.push(mixer);
        }
      }, undefined, (err) => {
        console.warn("Failed loading asset:", path);
      });
    }

    // Load Animated Models from your folder
    loadAnimatedModel('./Animated (2).glb', -5, 10);
    loadAnimatedModel('./Ped (2).glb', 5, 10);

    // Render loop with time delta updates for animation playback
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      
      const delta = clock.getDelta();
      animationMixers.forEach(mixer => mixer.update(delta));
      
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
