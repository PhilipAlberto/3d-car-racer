<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Raging Thunder - Multiplayer & Narrative Mode</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #050510;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
            color: #fff;
        }
        #gameContainer {
            position: relative;
            width: 800px;
            height: 450px;
        }
        #gameCanvas {
            border: 4px solid #222;
            box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
            background: #000;
            display: block;
        }
        .ui-panel {
            position: absolute;
            top: 15px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            background: rgba(0, 0, 0, 0.8);
            padding: 8px 25px;
            border-radius: 30px;
            border: 1px solid #00ffcc;
            pointer-events: none;
            z-index: 10;
        }
        .stat { color: #fff; font-size: 16px; font-weight: bold; }
        .stat span { color: #00ffcc; }
        
        /* Narrative Banner Overlay */
        #narrativeBanner {
            position: absolute;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            background: rgba(10, 15, 28, 0.85);
            border-left: 4px solid #ff3b30;
            border-right: 4px solid #ff3b30;
            padding: 10px 15px;
            border-radius: 6px;
            pointer-events: none;
            transition: all 0.3s ease;
            z-index: 10;
        }
        #narrativeTitle {
            font-size: 12px;
            letter-spacing: 1.5px;
            color: #ff3b30;
            text-transform: uppercase;
            font-weight: bold;
        }
        #narrativeText {
            font-size: 14px;
            color: #e0e0e0;
            margin-top: 2px;
        }
    </style>
</head>
<body>

    <div id="gameContainer">
        <div class="ui-panel">
            <div class="stat">POS: <span id="rankTxt">5/5</span></div>
            <div class="stat">SPEED: <span id="speedTxt">0</span> KM/H</div>
            <div class="stat">SCORE: <span id="scoreTxt">0</span></div>
            <div class="stat">LAP: <span id="lapTxt">1/3</span></div>
        </div>

        <canvas id="gameCanvas" width="800" height="450"></canvas>

        <div id="narrativeBanner">
            <div id="narrativeTitle">ACT I: THE UNDERGROUND QUALIFIER</div>
            <div id="narrativeText">Outrun the rival syndicate drivers to retain your vehicle clearance!</div>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');

        // Game Configuration & Constants
        const width = canvas.width;
        const height = canvas.height;
        const roadW = 2000;      // Road width in 3D world space
        const segL = 200;        // Length of each road segment
        const camD = 0.84;       // Camera depth / Field of View factor

        // Controls State
        const keys = { ArrowLeft: false, ArrowRight: false, ArrowUp: false, ArrowDown: false };
        window.addEventListener('keydown', e => { if(e.key in keys) keys[e.key] = true; });
        window.addEventListener('keyup', e => { if(e.key in keys) keys[e.key] = false; });

        // Player Variables
        let playerX = 0;         // Normalized position offset from center (-1 to 1)
        let position = 0;        // Progress along the track length
        let speed = 0;           // Current movement velocity
        const maxSpeed = 160;    // Ultimate top velocity limit
        let playerLap = 1;

        // Multiplayer / Rival Drivers Setup (5 total grid cars)
        const rivals = [
            { id: "Apex", color: "#00ccff", x: -0.5, pos: 1200, speed: 135, lap: 1 },
            { id: "Viper", color: "#ffcc00", x: 0.4, pos: 800, speed: 142, lap: 1 },
            { id: "Phantom", color: "#aa00ff", x: -0.2, pos: 400, speed: 130, lap: 1 },
            { id: "Titan", color: "#00ff66", x: 0.6, pos: 200, speed: 125, lap: 1 }
        ];

        // Track generation array
        const lines = [];
        
        // Build a procedurally curved 3D highway layout
        for (let i = 0; i < 1600; i++) {
            let curve = 0;
            // Generate sweeping turns at intervals
            if (i > 100 && i < 300) curve = 2.5;
            if (i > 500 && i < 700) curve = -3.5;
            if (i > 900 && i < 1200) curve = 4.0;

            lines.push({
                x: 0, y: 0, z: i * segL, // 3D Coordinates
                curve: curve,
                screenX: 0, screenY: 0, screenW: 0
            });
        }
        const N = lines.length;

        // Mathematical projection from 3D coordinates down to 2D canvas
        function project(p, camX, camY, camZ) {
            let worldX = p.x - camX;
            let worldY = p.y - camY;
            let worldZ = p.z - camZ;

            let scale = camD / worldZ;
            
            p.screenX = Math.round((width / 2) + (scale * worldX * width / 2));
            p.screenY = Math.round((height / 2) - (scale * worldY * height / 2));
            p.screenW = Math.round(scale * roadW * width / 2);
        }

        // Helper to draw trapezoidal 3D road polygons
        function drawPolygon(x1, y1, w1, x2, y2, w2, color) {
            ctx.fillStyle = color;
            ctx.beginPath();
            ctx.moveTo(x1 - w1, y1);
            ctx.lineTo(x2 - w2, y2);
            ctx.lineTo(x2 + w2, y2);
            ctx.lineTo(x1 + w1, y1);
            ctx.closePath();
            ctx.fill();
        }

        // Draw Player & Opponent Vehicles using your custom chassis layout
        function drawCar(carX, carY, carW, carH, bodyColor, isBraking = false, turnOffset = 0) {
            // Main Car Body (Chassis)
            ctx.fillStyle = bodyColor; 
            ctx.beginPath();
            ctx.roundRect(carX, carY, carW, carH, 12);
            ctx.fill();

            // Cockpit Canopy / Back Window Glass
            ctx.fillStyle = "#111";
            ctx.beginPath();
            ctx.roundRect(carX + (carW * 0.15), carY + 10, carW * 0.7, carH * 0.4, 6);
            ctx.fill();

            // Left/Right Spoiler Wings
            ctx.fillStyle = "#111";
            ctx.fillRect(carX - 5, carY + carH - 15, 10, 10);
            ctx.fillRect(carX + carW - 5, carY + carH - 15, 10, 10);

            // Tail glowing brake lights
            ctx.fillStyle = isBraking ? "#ff9500" : "#ff0055";
            ctx.shadowBlur = 15;
            ctx.shadowColor = ctx.fillStyle;
            ctx.fillRect(carX + 10, carY + carH - 25, 20, 8);
            ctx.fillRect(carX + carW - 30, carY + carH - 25, 20, 8);
            ctx.shadowBlur = 0; // reset glow
        }

        // Plot trigger tracker
        let lastPlotStage = "";
        function updatePlotStory(rank) {
            let title = "ACT I: THE QUALIFIER";
            let desc = "";

            if (rank === 1) {
                desc = "CRITICAL: You hold 1st place! Keep pressing forward to secure the team trophy.";
            } else if (rank <= 3) {
                desc = "Rivals are gaining ground on the curves. Hold line control!";
            } else {
                desc = "WARNING: Danger of elimination! Increase speed on straight stretches.";
            }

            if (desc !== lastPlotStage) {
                document.getElementById('narrativeTitle').innerText = title;
                document.getElementById('narrativeText').innerText = desc;
                lastPlotStage = desc;
            }
        }

        function gameLoop() {
            // 1. INPUT HANDLING & VEHICLE PHYSICS
            if (keys.ArrowUp) speed = Math.min(speed + 2, maxSpeed);
            else if (keys.ArrowDown) speed = Math.max(speed - 4, 0);
            else speed = Math.max(speed - 1, 0); // Engine braking

            if (keys.ArrowLeft && speed > 0) playerX -= 0.04 * (speed / maxSpeed);
            if (keys.ArrowRight && speed > 0) playerX += 0.04 * (speed / maxSpeed);

            // Progress position along track circuit
            position += speed;
            if (position >= N * segL) {
                position -= N * segL;
                playerLap++;
            }

            // Update AI Opponents
            rivals.forEach(r => {
                r.pos += r.speed;
                if (r.pos >= N * segL) {
                    r.pos -= N * segL;
                    r.lap++;
                }
                // Mild steering weaving along track curve
                let segIndex = Math.floor(r.pos / segL) % N;
                r.x += lines[segIndex].curve * 0.005;
                r.x = Math.max(-0.8, Math.min(0.8, r.x));
            });

            // Calculate Rankings
            let allDrivers = [
                { id: "Player", score: (playerLap * N * segL) + position },
                ...rivals.map(r => ({ id: r.id, score: (r.lap * N * segL) + r.pos }))
            ];
            allDrivers.sort((a, b) => b.score - a.score);
            let rank = allDrivers.findIndex(d => d.id === "Player") + 1;

            // 2. RENDERING THE 3D WORLD
            ctx.clearRect(0, 0, width, height);

            // Sky Background
            ctx.fillStyle = "#0c1424";
            ctx.fillRect(0, 0, width, height / 2);

            let startPos = Math.floor(position / segL);
            let camH = 1500; // Camera height
            let maxY = height;
            let xOffset = 0;
            let dx = 0;

            // Project road segments back-to-front
            let targetLines = [];
            for (let i = 0; i < 80; i++) {
                let index = (startPos + i) % N;
                let l = lines[index];
                let camZOffset = (startPos + i >= N) ? N * segL : 0;
                
                dx += l.curve;
                xOffset += dx;

                project(l, playerX * roadW - xOffset, camH, position - camZOffset);
                targetLines.push({line: l, idx: index, worldZ: (startPos + i) * segL});
            }

            // Draw segments back-to-front (Painter's Algorithm)
            for (let i = targetLines.length - 1; i > 0; i--) {
                let curr = targetLines[i].line;
                let prev = targetLines[i-1].line;

                if (curr.screenY >= maxY) continue;
                maxY = curr.screenY;

                let isEven = Math.floor((startPos + i) / 3) % 2 === 0;
                let grassColor = isEven ? "#135c34" : "#0d4727";
                let roadColor  = isEven ? "#2c2c36" : "#33333d";
                let rumbleColor = isEven ? "#fff" : "#ff3b30";

                // Terrain
                ctx.fillStyle = grassColor;
                ctx.fillRect(0, curr.screenY, width, prev.screenY - curr.screenY);

                // Road Surface
                drawPolygon(prev.screenX, prev.screenY, prev.screenW, curr.screenX, curr.screenY, curr.screenW, roadColor);

                // Rumble Strips
                drawPolygon(prev.screenX, prev.screenY, prev.screenW * 1.08, curr.screenX, curr.screenY, curr.screenW * 1.08, rumbleColor);
                drawPolygon(prev.screenX, prev.screenY, prev.screenW, curr.screenX, curr.screenY, curr.screenW, roadColor);

                // Render Opponents located on this segment
                let segWorldZ = targetLines[i].worldZ;
                rivals.forEach(r => {
                    let rRelativePos = (r.lap * N * segL) + r.pos - ((playerLap * N * segL) + position);
                    if (Math.abs(rRelativePos - (i * segL)) < segL / 2 && rRelativePos > 0) {
                        let scale = camD / rRelativePos;
                        let spriteX = curr.screenX + (scale * r.x * roadW * width / 2);
                        let spriteY = curr.screenY;
                        let spriteW = 100 * (scale * 800);
                        let spriteH = 60 * (scale * 800);

                        drawCar(spriteX - spriteW/2, spriteY - spriteH, spriteW, spriteH, r.color, false);
                    }
                });
            }

            // 3. RENDER THE PLAYER CAR PERSPECTIVE
            let carScale = 1.0;
            let carTurnOffset = 0;
            if (keys.ArrowLeft) { carScale = 0.95; carTurnOffset = -5; }
            if (keys.ArrowRight) { carScale = 0.95; carTurnOffset = 5; }

            let carW = 130 * carScale;
            let carH = 75;
            let carX = width / 2 - carW / 2 + carTurnOffset;
            let carY = height - carH - 20;

            drawCar(carX, carY, carW, carH, "#ff2a2a", (speed > 0 && keys.ArrowDown), carTurnOffset);

            // 4. UPDATE INTERFACE & NARRATIVE
            document.getElementById('speedTxt').innerText = Math.floor((speed / maxSpeed) * 240);
            document.getElementById('scoreTxt').innerText = Math.floor(position / 100);
            document.getElementById('rankTxt').innerText = `${rank}/5`;
            document.getElementById('lapTxt').innerText = `${Math.min(playerLap, 3)}/3`;

            updatePlotStory(rank);

            requestAnimationFrame(gameLoop);
        }

        // Start execution
        requestAnimationFrame(gameLoop);
    </script>
</body>
</html>
