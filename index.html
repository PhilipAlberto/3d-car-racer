<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D World & Asset Inspector</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #111827; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #canvas-container { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }

    /* Controls Overlay */
    #ui-overlay {
      position: absolute; top: 20px; left: 20px; z-index: 10;
      background: rgba(17, 24, 39, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px); padding: 16px 22px; border-radius: 14px; color: #fff;
      max-width: 320px; pointer-events: none;
    }
    #ui-overlay h1 { font-size: 18px; font-weight: 800; color: #38ef7d; margin-bottom: 6px; }
    #ui-overlay p { font-size: 12px; color: #9ca3af; line-height: 1.5; margin-bottom: 10px; }
    .control-tip { display: flex; justify-content: space-between; font-size: 11px; margin-bottom: 4px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 4px; }
    .control-tip span.key { font-weight: bold; color: #f3f4f6; }

    /* Object Selector Menu */
    #inspector-panel {
      position: absolute; top: 20px; right: 20px; z-index: 10;
      background: rgba(17, 24, 39, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      backdrop-filter: blur(12px); padding: 16px; border-radius: 14px; color: #fff; width: 220px;
    }
    #inspector-panel h2 { font-size: 12px; text-transform: uppercase; letter-spacing: 1px; color: #9ca3af; margin-bottom: 10px; }
    .btn-list { display: flex; flex-direction: column; gap: 6px; max-height: 300px; overflow-y: auto; }
    .btn-item {
      background: #1f2937; color: #e5e7eb; border: 1px solid #374151; padding: 8px 12px;
      border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; text-align: left;
      transition: all 0.2s;
    }
    .btn-item:hover { background: #374151; color: #38ef7d; border-color: #38ef7d; }

    /* Loading Screen */
    #loader {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #111827;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; color: #fff; transition: opacity 0.5s;
    }
    .spinner { width: 40px; height: 40px; border: 4px solid #1f2937; border-top: 4px solid #38ef7d; border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loader">
    <div class="spinner"></div>
    <div style="font-size: 14px; letter-spacing: 1px; color: #9ca3af;">LOADING REPOSITORY 3D ASSETS...</div>
  </div>

  <div id="canvas-container"></div>

  <div id="ui-overlay">
    <h1>3D WORLD INSPECTOR</h1>
    <p>Explore all buildings, vegetation, airport structures, aircraft, and AI characters.</p>
    <div class="control-tip"><span class="key">Left Click + Drag</span> <span>Rotate View</span></div>
    <div class="control-tip"><span class="key">Right Click + Drag</span> <span>Pan Camera</span></div>
    <div class="control-tip"><span class="key">Scroll Wheel</span> <span>Zoom In / Out</span></div>
    <div class="control-tip"><span class="key">W / A / S / D</span> <span>Move Camera</span></div>
  </div>

  <div id="inspector-panel">
    <h2>Focus Asset</h2>
    <div class="btn-list">
      <button class="btn-item" onclick="focusCamera(0, 5, 0)">Center City</button>
      <button class="btn-item" onclick="focusOnCategory('buildings')">Buildings Hub</button>
      <button class="btn-item" onclick="focusOnCategory('airport')">Airport Zone</button>
      <button class="btn-item" onclick="focusOnCategory('pedestrians')">AI Pedestrians</button>
      <button class="btn-item" onclick="focusOnCategory('planes')">Overhead Aircraft</button>
    </div>
  </div>

  <script>
    // Repository Asset Manifest
    const manifest = {
      buildings: ['Building (1).glb', 'Building (2).glb', 'Building (3).glb', 'Building (4).glb', 'Building (5).glb', 'Building (6).glb', 'Building (7).glb', 'Building (8).glb', 'Building (9).glb', 'Building (10).glb', 'Building (11).glb', 'Building (12).glb', 'Building (13).glb', 'Building (14).glb', 'Building (19).glb', 'Building (20).glb', 'Building (24).glb'],
      trees: ['Tree (2).glb', 'Tree (3).glb', 'Tree (4).glb', 'Tree (5).glb', 'Tree (6).glb', 'Tree (8).glb'],
      traffic: ['T-vehicle (1).glb', 'T-vehicle (2).glb', 'T-vehicle (3).glb'],
      planes: ['Aeroplane (1).glb', 'Aeroplane (2).glb', 'Aeroplane (3).glb'],
      pedestrians: ['Ped (2).glb', 'Animated (2).glb'],
      landmarks: ['Airport 2.glb', 'bridge.glb']
    };

    // Scene & Renderer
    const container = document.getElementById('canvas-container');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.0015);

    const camera = new THREE.PerspectiveCamera(55, window.innerWidth / window.innerHeight, 0.5, 2000);
    camera.position.set(0, 35, 75);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    container.appendChild(renderer.domElement);

    // Mouse Orbit Controls
    const controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.maxPolarAngle = Math.PI / 2 - 0.02; // Prevent camera clipping below ground
    controls.minDistance = 2;
    controls.maxDistance = 500;

    // Lighting
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xfff5e6, 1.6);
    sun.position.set(80, 120, 60);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    // Ground Plane & Road Framework
    const groundGeo = new THREE.PlaneGeometry(1000, 1000);
    groundGeo.rotateX(-Math.PI / 2);
    const groundMat = new THREE.MeshStandardMaterial({ color: 0x4b7bec, roughness: 0.9 });
    const ground = new THREE.Mesh(groundGeo, groundMat);
    ground.position.y = -0.1;
    ground.receiveShadow = true;
    scene.add(ground);

    // Add Main Road Segment
    const roadGeo = new THREE.PlaneGeometry(30, 800);
    roadGeo.rotateX(-Math.PI / 2);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x2d3436, roughness: 0.7 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.receiveShadow = true;
    scene.add(road);

    // GLTF Loader & Animation Mixers
    const gltfLoader = new THREE.GLTFLoader();
    const animationMixers = [];
    const categoryPositions = { buildings: [], airport: [], pedestrians: [], planes: [] };

    function normalizeModel(model, targetSize = 10) {
      const box = new THREE.Box3().setFromObject(model);
      const size = box.getSize(new THREE.Vector3());
      const maxDim = Math.max(size.x, size.y, size.z);
      if (maxDim > 0) {
        const scale = targetSize / maxDim;
        model.scale.set(scale, scale, scale);
      }
      box.setFromObject(model);
      const center = box.getCenter(new THREE.Vector3());
      model.position.x -= center.x;
      model.position.z -= center.z;
      model.position.y -= box.min.y;

      model.traverse(c => {
        if (c.isMesh) { c.castShadow = true; c.receiveShadow = true; }
      });
      return model;
    }

    let loadedCount = 0;
    const totalToLoad = 25;

    function checkLoadProgress() {
      loadedCount++;
      if (loadedCount >= 10) {
        const loader = document.getElementById('loader');
        loader.style.opacity = '0';
        setTimeout(() => loader.style.display = 'none', 500);
      }
    }

    // 1. Load Buildings along the left and right city blocks
    manifest.buildings.forEach((file, idx) => {
      gltfLoader.load(`./${file}`, (gltf) => {
        const m = normalizeModel(gltf.scene, 18 + (idx % 4) * 5);
        const side = idx % 2 === 0 ? -40 : 40;
        const zPos = -300 + (idx * 35);
        m.position.set(side, 0, zPos);
        scene.add(m);
        categoryPositions.buildings.push(m.position);
        checkLoadProgress();
      }, undefined, checkLoadProgress);
    });

    // 2. Load Airport & Bridge Landmarks
    gltfLoader.load('./Airport 2.glb', (gltf) => {
      const airport = normalizeModel(gltf.scene, 60);
      airport.position.set(-150, 0, -100);
      scene.add(airport);
      categoryPositions.airport.push(airport.position);
      checkLoadProgress();
    }, undefined, checkLoadProgress);

    gltfLoader.load('./bridge.glb', (gltf) => {
      const bridge = normalizeModel(gltf.scene, 40);
      bridge.position.set(0, 0, 200);
      scene.add(bridge);
      checkLoadProgress();
    }, undefined, checkLoadProgress);

    // 3. Load Vegetation / Trees
    manifest.trees.forEach((file, idx) => {
      gltfLoader.load(`./${file}`, (gltf) => {
        const tree = normalizeModel(gltf.scene, 6 + Math.random() * 4);
        const side = (idx % 2 === 0 ? -20 : 20) + (Math.random() * 5);
        tree.position.set(side, 0, -200 + (idx * 50));
        scene.add(tree);
        checkLoadProgress();
      }, undefined, checkLoadProgress);
    });

    // 4. Load AI Pedestrians with Animations
    const animatedPedestrians = [];
    manifest.pedestrians.forEach((file, idx) => {
      gltfLoader.load(`./${file}`, (gltf) => {
        const ped = normalizeModel(gltf.scene, 3.5);
        ped.position.set(-17 + (idx * 4), 0, -20 + (idx * 30));
        scene.add(ped);

        // Setup Skeletal Animation Playback if present
        if (gltf.animations && gltf.animations.length > 0) {
          const mixer = new THREE.AnimationMixer(ped);
          const action = mixer.clipAction(gltf.animations[0]);
          action.play();
          animationMixers.push(mixer);
        }

        ped.userData = { speed: 0.05 + Math.random() * 0.03, direction: 1, startZ: ped.position.z };
        animatedPedestrians.push(ped);
        categoryPositions.pedestrians.push(ped.position);
        checkLoadProgress();
      }, undefined, checkLoadProgress);
    });

    // 5. Load AI Traffic Vehicles
    const aiTraffic = [];
    manifest.traffic.forEach((file, idx) => {
      gltfLoader.load(`./${file}`, (gltf) => {
        const vehicle = normalizeModel(gltf.scene, 5);
        const lane = (idx % 2 === 0) ? -6 : 6;
        vehicle.position.set(lane, 0, -150 + (idx * 80));
        if (lane > 0) vehicle.rotation.y = Math.PI; // Face down lane
        scene.add(vehicle);
        vehicle.userData = { speed: 0.4 + Math.random() * 0.2, dir: lane > 0 ? 1 : -1 };
        aiTraffic.push(vehicle);
        checkLoadProgress();
      }, undefined, checkLoadProgress);
    });

    // 6. Overhead Planes
    const activePlanes = [];
    manifest.planes.forEach((file, idx) => {
      gltfLoader.load(`./${file}`, (gltf) => {
        const plane = normalizeModel(gltf.scene, 22);
        plane.position.set(200 - (idx * 150), 70 + (idx * 15), -100 + (idx * 80));
        scene.add(plane);
        plane.userData = { speed: 0.8 + Math.random() * 0.4 };
        activePlanes.push(plane);
        categoryPositions.planes.push(plane.position);
        checkLoadProgress();
      }, undefined, checkLoadProgress);
    });

    // Keyboard Pan Controls
    const keys = {};
    window.addEventListener('keydown', e => keys[e.code] = true);
    window.addEventListener('keyup', e => keys[e.code] = false);

    function handleKeyboardPan() {
      const panSpeed = 0.8;
      if (keys['KeyW'] || keys['ArrowUp']) camera.position.z -= panSpeed;
      if (keys['KeyS'] || keys['ArrowDown']) camera.position.z += panSpeed;
      if (keys['KeyA'] || keys['ArrowLeft']) camera.position.x -= panSpeed;
      if (keys['KeyD'] || keys['ArrowRight']) camera.position.x += panSpeed;
    }

    // Camera Focus Helpers
    function focusCamera(x, y, z) {
      controls.target.set(x, y, z);
      camera.position.set(x + 15, y + 15, z + 25);
    }

    function focusOnCategory(cat) {
      const list = categoryPositions[cat];
      if (list && list.length > 0) {
        const pos = list[0];
        focusCamera(pos.x, pos.y + 2, pos.z);
      }
    }

    // Main Animation & AI Loop
    const clock = new THREE.Clock();

    function animate() {
      requestAnimationFrame(animate);
      const delta = clock.getDelta();

      // Update Skeletal Animations (Walking/Character loops)
      animationMixers.forEach(mixer => mixer.update(delta));

      // AI Pedestrian Sidewalk Movement
      animatedPedestrians.forEach(ped => {
        ped.position.z += ped.userData.speed * ped.userData.direction;
        if (Math.abs(ped.position.z - ped.userData.startZ) > 40) {
          ped.userData.direction *= -1;
          ped.rotation.y += Math.PI; // Turn around
        }
      });

      // AI Traffic Driving
      aiTraffic.forEach(v => {
        v.position.z += v.userData.speed * v.userData.dir;
        if (v.position.z > 350) v.position.z = -350;
        if (v.position.z < -350) v.position.z = 350;
      });

      // AI Overhead Flight Loops
      activePlanes.forEach(plane => {
        plane.position.x -= plane.userData.speed;
        if (plane.position.x < -400) plane.position.x = 400;
      });

      handleKeyboardPan();
      controls.update();
      renderer.render(scene, camera);
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
