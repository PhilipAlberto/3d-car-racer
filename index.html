<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Asset World Builder & Calibration</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #0f172a; font-family: system-ui, -apple-system, sans-serif; color: #f8fafc; }
    #viewport { width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; z-index: 1; }

    /* UI Overlay */
    .panel {
      position: absolute; z-index: 10;
      background: rgba(15, 23, 42, 0.9); border: 1px solid rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(12px); border-radius: 8px; padding: 14px; font-size: 12px;
    }
    #panel-left { top: 20px; left: 20px; width: 260px; }
    #panel-right { top: 20px; right: 20px; width: 280px; }
    
    #status-badge {
      position: absolute; top: 20px; left: 50%; transform: translateX(-50%); z-index: 20;
      background: #1e293b; color: #38ef7d; border: 1px solid #38ef7d;
      padding: 6px 16px; border-radius: 20px; font-size: 11px; font-weight: bold;
    }
    
    button {
      background: #1e293b; color: #f8fafc; border: 1px solid rgba(255,255,255,0.15);
      padding: 8px; border-radius: 4px; font-size: 11px; font-weight: 600; cursor: pointer;
      width: 100%; margin-top: 6px;
    }
    button:hover { border-color: #38ef7d; color: #38ef7d; }
  </style>

  <!-- Reliable CDN Dependencies -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="status-badge">Initializing 3D Engine...</div>

  <div id="panel-left" class="panel">
    <h3 style="color:#38ef7d; margin-bottom:8px;">ASSET WORLD BUILDER</h3>
    <p style="color:#94a3b8; font-size:11px;">Inspect and calibrate project assets.</p>
    <button onclick="loadCarAsset()">Load car.glb</button>
  </div>

  <div id="panel-right" class="panel">
    <h3 style="color:#94a3b8; margin-bottom:8px;">INSPECTOR</h3>
    <div id="inspect-info" style="color:#94a3b8;">No asset active</div>
  </div>

  <div id="viewport"></div>

  <script>
    const badge = document.getElementById('status-badge');
    let scene, camera, renderer, controls, currentModel;

    function initEngine() {
      // Check if libraries loaded correctly
      if (typeof THREE === 'undefined' || typeof THREE.OrbitControls === 'undefined') {
        badge.style.color = '#ef4444';
        badge.style.borderColor = '#ef4444';
        badge.innerText = 'Error: Three.js CDN blocked or unreachable.';
        return;
      }

      const container = document.getElementById('viewport');

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x87ceeb);

      camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
      camera.position.set(8, 5, 12);

      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;

      // Lighting
      scene.add(new THREE.AmbientLight(0xffffff, 0.7));
      const sun = new THREE.DirectionalLight(0xffffff, 1.2);
      sun.position.set(20, 40, 20);
      scene.add(sun);

      // Ground Plane
      const ground = new THREE.Mesh(
        new THREE.PlaneGeometry(100, 100),
        new THREE.MeshStandardMaterial({ color: 0x334155 })
      );
      ground.rotation.x = -Math.PI / 2;
      scene.add(ground);

      badge.innerText = 'Ready — Three.js Loaded';
      animate();
    }

    function loadCarAsset() {
      if (!THREE.GLTFLoader) return;
      badge.innerText = 'Loading car.glb...';

      const loader = new THREE.GLTFLoader();
      loader.load('./car.glb', (gltf) => {
        if (currentModel) scene.remove(currentModel);
        currentModel = gltf.scene;
        scene.add(currentModel);

        badge.innerText = 'car.glb Loaded Successfully';
        document.getElementById('inspect-info').innerText = 'Model: car.glb Active';
      }, undefined, (err) => {
        badge.style.color = '#ef4444';
        badge.innerText = 'Failed to find ./car.glb in root directory.';
      });
    }

    function animate() {
      requestAnimationFrame(animate);
      if (controls) controls.update();
      if (renderer && scene && camera) renderer.render(scene, camera);
    }

    window.addEventListener('resize', () => {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // Start engine on window load
    window.onload = initEngine;
  </script>
</body>
</html>
