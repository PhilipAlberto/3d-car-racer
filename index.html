<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Sunny Highway Racer 3D</title>

<style>

* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #87b9df;
    font-family: Arial, sans-serif;
}

canvas {
    display: block;
}

/* =========================
   LOADING
========================= */

#loading {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background: #07111c;
    color: white;
}

#loading h1 {
    font-size: 42px;
    letter-spacing: 4px;
}

#loading p {
    margin-top: 12px;
    color: #8ba6bb;
}

#loading-bar {
    width: 300px;
    height: 5px;

    margin-top: 25px;

    background: #1d2b38;
    border-radius: 10px;
    overflow: hidden;
}

#loading-progress {
    width: 0%;
    height: 100%;
    background: #2196f3;
}

/* =========================
   MENU
========================= */

#menu {
    position: fixed;
    inset: 0;
    z-index: 100;

    display: none;
    align-items: center;
    justify-content: center;

    pointer-events: none;
}

.menu-card {
    pointer-events: auto;

    min-width: 300px;
    padding: 30px;

    text-align: center;

    background: rgba(4, 12, 20, 0.88);
    color: white;

    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 16px;

    backdrop-filter: blur(10px);
}

.menu-card h1 {
    font-size: 30px;
    margin-bottom: 8px;
}

.menu-card p {
    color: #8ca5b7;
    margin-bottom: 25px;
}

button {
    border: 0;
    border-radius: 9px;

    padding: 13px 25px;

    background: #168df0;
    color: white;

    font-size: 15px;
    font-weight: bold;

    cursor: pointer;
}

button:hover {
    background: #35a7ff;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;

    z-index: 50;

    display: none;

    pointer-events: none;

    color: white;
}

#score-box {
    position: absolute;
    top: 20px;
    left: 20px;

    padding: 12px 18px;

    background: rgba(0,0,0,0.55);

    border-radius: 10px;

    font-size: 18px;
}

#speed-box {
    position: absolute;
    bottom: 25px;
    left: 25px;

    padding: 15px 20px;

    background: rgba(0,0,0,0.65);

    border-radius: 12px;

    font-size: 24px;
    font-weight: bold;
}

#help {
    position: absolute;
    right: 20px;
    bottom: 20px;

    padding: 10px 14px;

    background: rgba(0,0,0,0.55);

    border-radius: 8px;

    color: #c5d5df;
    font-size: 12px;
}

/* =========================
   GAME OVER
========================= */

#game-over {
    position: fixed;
    inset: 0;

    z-index: 200;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,0.65);
}

.game-over-card {
    padding: 35px;

    width: 330px;

    text-align: center;

    background: #091522;

    color: white;

    border-radius: 15px;
}

.game-over-card h1 {
    color: #ff5252;
    margin-bottom: 15px;
}

.game-over-card p {
    margin-bottom: 20px;
    color: #a6bac9;
}

</style>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- GLB LOADER -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>


<!-- =========================
     LOADING SCREEN
========================= -->

<div id="loading">

    <h1>SUNNY HIGHWAY</h1>

    <p id="loading-text">
        Starting 3D engine...
    </p>

    <div id="loading-bar">
        <div id="loading-progress"></div>
    </div>

</div>


<!-- =========================
     START MENU
========================= -->

<div id="menu">

    <div class="menu-card">

        <h1>SUNNY HIGHWAY</h1>

        <p>
            3D HIGHWAY RACER
        </p>

        <button onclick="startGame()">
            START RACE
        </button>

    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div id="score-box">
        Score: <span id="score">0</span>
    </div>

    <div id="speed-box">
        <span id="speed">0</span> KM/H
    </div>

    <div id="help">
        W / ↑ Accelerate &nbsp; | &nbsp;
        S / ↓ Brake &nbsp; | &nbsp;
        A / D Steer
    </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="game-over">

    <div class="game-over-card">

        <h1>CRASHED</h1>

        <p>
            Final Score:
            <strong id="final-score">0</strong>
        </p>

        <button onclick="restartGame()">
            DRIVE AGAIN
        </button>

    </div>

</div>


<script>

/* =========================================================
   SUNNY HIGHWAY RACER
   STABLE BASE VERSION
========================================================= */


/* =========================================================
   VARIABLES
========================================================= */

let scene;
let camera;
let renderer;

let loader;

let player;
let playerModel;

let traffic = [];

let gameStarted = false;
let crashed = false;

let speed = 0;
let score = 0;

let lastTime = performance.now();

const keys = {};


/* =========================================================
   CONSTANTS
========================================================= */

const ROAD_WIDTH = 24;

const ROAD_LENGTH = 4000;

const PLAYER_Z = 20;

const MAX_SPEED = 1.15;

const ACCELERATION = 0.018;

const BRAKE_POWER = 0.035;

const FRICTION = 0.008;

const STEERING = 0.28;


/* =========================================================
   INITIALIZE THREE.JS
========================================================= */

function initThree() {

    scene =
        new THREE.Scene();


    scene.background =
        new THREE.Color(
            0x91c4e8
        );


    scene.fog =
        new THREE.Fog(
            0x91c4e8,
            150,
            900
        );


    /* CAMERA */

    camera =
        new THREE.PerspectiveCamera(
            60,
            window.innerWidth /
            window.innerHeight,
            0.1,
            2000
        );


    camera.position.set(
        0,
        5,
        PLAYER_Z + 12
    );


    /* RENDERER */

    renderer =
        new THREE.WebGLRenderer({
            antialias: true
        });


    renderer.setSize(
        window.innerWidth,
        window.innerHeight
    );


    renderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );


    renderer.shadowMap.enabled = true;


    renderer.shadowMap.type =
        THREE.PCFSoftShadowMap;


    renderer.outputEncoding =
        THREE.sRGBEncoding;


    document.body.appendChild(
        renderer.domElement
    );


    /* LOADER */

    loader =
        new THREE.GLTFLoader();


    /* LIGHTING */

    const skyLight =
        new THREE.HemisphereLight(
            0xd8edff,
            0x35502f,
            1.8
        );

    scene.add(
        skyLight
    );


    const sun =
        new THREE.DirectionalLight(
            0xffffff,
            2
        );


    sun.position.set(
        -100,
        150,
        100
    );


    sun.castShadow = true;


    sun.shadow.mapSize.width =
        2048;

    sun.shadow.mapSize.height =
        2048;


    scene.add(
        sun
    );


    createWorld();

}


/* =========================================================
   WORLD
========================================================= */

function createWorld() {

    /* GRASS */

    const grassGeometry =
        new THREE.PlaneGeometry(
            500,
            ROAD_LENGTH
        );


    const grassMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x4f8044,
            roughness: 1
        });


    const grass =
        new THREE.Mesh(
            grassGeometry,
            grassMaterial
        );


    grass.rotation.x =
        -Math.PI / 2;


    grass.position.set(
        0,
        -0.15,
        -ROAD_LENGTH / 2
    );


    grass.receiveShadow = true;


    scene.add(
        grass
    );


    /* ROAD */

    const roadGeometry =
        new THREE.PlaneGeometry(
            ROAD_WIDTH,
            ROAD_LENGTH
        );


    const roadMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x303337,
            roughness: 0.9
        });


    const road =
        new THREE.Mesh(
            roadGeometry,
            roadMaterial
        );


    road.rotation.x =
        -Math.PI / 2;


    road.position.set(
        0,
        0,
        -ROAD_LENGTH / 2
    );


    road.receiveShadow = true;


    scene.add(
        road
    );


    /* ROAD EDGES */

    createRoadLine(
        -ROAD_WIDTH / 2 + 1,
        0xffffff
    );

    createRoadLine(
        ROAD_WIDTH / 2 - 1,
        0xffffff
    );


    /* CENTER LANE MARKINGS */

    for (
        let z = 0;
        z > -ROAD_LENGTH;
        z -= 20
    ) {

        const geometry =
            new THREE.BoxGeometry(
                0.25,
                0.03,
                8
            );


        const material =
            new THREE.MeshBasicMaterial({
                color: 0xffffff
            });


        const line =
            new THREE.Mesh(
                geometry,
                material
            );


        line.position.set(
            0,
            0.025,
            z
        );


        scene.add(
            line
        );

    }


    /* SIMPLE ROAD SIDE OBJECTS */

    createRoadside();

}


/* =========================================================
   ROAD EDGE
========================================================= */

function createRoadLine(
    x,
    color
) {

    const geometry =
        new THREE.BoxGeometry(
            0.25,
            0.04,
            ROAD_LENGTH
        );


    const material =
        new THREE.MeshBasicMaterial({
            color: color
        });


    const line =
        new THREE.Mesh(
            geometry,
            material
        );


    line.position.set(
        x,
        0.03,
        -ROAD_LENGTH / 2
    );


    scene.add(
        line
    );

}


/* =========================================================
   ROADSIDE
========================================================= */

function createRoadside() {

    const poleMaterial =
        new THREE.MeshStandardMaterial({
            color: 0x555555
        });


    for (
        let z = -40;
        z > -ROAD_LENGTH;
        z -= 60
    ) {

        for (
            const side of [-1, 1]
        ) {

            const pole =
                new THREE.Mesh(
                    new THREE.BoxGeometry(
                        0.2,
                        4,
                        0.2
                    ),
                    poleMaterial
                );


            pole.position.set(
                side * 18,
                2,
                z
            );


            pole.castShadow = true;


            scene.add(
                pole
            );

        }

    }

}


/* =========================================================
   MODEL GROUNDING
========================================================= */

function prepareVehicle(
    model,
    targetLength
) {

    model.updateMatrixWorld(
        true
    );


    /*
       FIRST:
       find actual model dimensions
    */

    let box =
        new THREE.Box3()
            .setFromObject(
                model
            );


    let size =
        new THREE.Vector3();


    box.getSize(
        size
    );


    /*
       SCALE BASED ON LENGTH

       This is much safer for cars than
       scaling by the largest dimension.
    */

    if (
        size.z > 0
    ) {

        const scale =
            targetLength /
            size.z;


        model.scale.setScalar(
            scale
        );

    }


    model.updateMatrixWorld(
        true
    );


    /*
       RE-CALCULATE BOUNDS
    */

    box =
        new THREE.Box3()
            .setFromObject(
                model
            );


    const center =
        new THREE.Vector3();


    box.getCenter(
        center
    );


    /*
       CENTER X/Z
    */

    model.position.x -=
        center.x;


    model.position.z -=
        center.z;


    model.updateMatrixWorld(
        true
    );


    /*
       NOW GROUND IT.
    */

    box =
        new THREE.Box3()
            .setFromObject(
                model
            );


    model.position.y -=
        box.min.y;


    model.updateMatrixWorld(
        true
    );


    /*
       SHADOWS
    */

    model.traverse(
        object => {

            if (
                object.isMesh
            ) {

                object.castShadow =
                    true;

                object.receiveShadow =
                    true;

            }

        }
    );


    return model;

}


/* =========================================================
   LOAD PLAYER
========================================================= */

function loadPlayer() {

    return new Promise(
        (resolve, reject) => {

            document.getElementById(
                "loading-text"
            ).textContent =
                "Loading player vehicle...";


            loader.load(

                "./car.glb",

                gltf => {

                    player =
                        new THREE.Group();


                    player.position.set(
                        0,
                        0,
                        PLAYER_Z
                    );


                    playerModel =
                        gltf.scene;


                    /*
                       IMPORTANT:
                       This is the only vehicle
                       we are loading right now.
                    */

                    prepareVehicle(
                        playerModel,
                        5
                    );


                    player.add(
                        playerModel
                    );


                    scene.add(
                        player
                    );


                    /*
                       Make sure vehicle is
                       sitting exactly on road.
                    */

                    player.position.y =
                        0;


                    resolve();

                },


                xhr => {

                    if (
                        xhr.total
                    ) {

                        const percent =
                            (
                                xhr.loaded /
                                xhr.total
                            ) * 100;


                        document.getElementById(
                            "loading-progress"
                        ).style.width =
                            percent + "%";

                    }

                },


                error => {

                    console.error(
                        "PLAYER GLB ERROR:",
                        error
                    );


                    reject(
                        error
                    );

                }

            );

        }
    );

}


/* =========================================================
   TRAFFIC VEHICLE
========================================================= */

function loadTrafficVehicle(
    file,
    x,
    z
) {

    loader.load(

        file,

        gltf => {

            const vehicle =
                new THREE.Group();


            const model =
                gltf.scene;


            prepareVehicle(
                model,
                4.5
            );


            vehicle.add(
                model
            );


            vehicle.position.set(
                x,
                0,
                z
            );


            vehicle.userData.speed =
                0.35 +
                Math.random() *
                0.2;


            scene.add(
                vehicle
            );


            traffic.push(
                vehicle
            );

        },

        undefined,

        error => {

            console.warn(
                "Traffic model failed:",
                file,
                error
            );

        }

    );

}


/* =========================================================
   LOAD TRAFFIC
========================================================= */

function loadTraffic() {

    const vehicles = [

        {
            file: "./T-vehicle (1).glb",
            x: -6,
            z: -80
        },

        {
            file: "./T-vehicle (2).glb",
            x: 2,
            z: -160
        },

        {
            file: "./T-vehicle (3).glb",
            x: 7,
            z: -250
        }

    ];


    vehicles.forEach(
        vehicle => {

            loadTrafficVehicle(
                vehicle.file,
                vehicle.x,
                vehicle.z
            );

        }
    );

}


/* =========================================================
   INPUT
========================================================= */

window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;


        if (
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(
                event.key.toLowerCase()
            )
        ) {

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* =========================================================
   PLAYER MOVEMENT
========================================================= */

function updatePlayer(
    delta
) {

    if (
        !player ||
        crashed
    ) {

        return;

    }


    /* ACCELERATION */

    if (
        keys["w"] ||
        keys["arrowup"]
    ) {

        speed +=
            ACCELERATION;

    }
    else {

        speed -=
            FRICTION;

    }


    /* BRAKE */

    if (
        keys["s"] ||
        keys["arrowdown"]
    ) {

        speed -=
            BRAKE_POWER;

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            0,
            MAX_SPEED
        );


    /* STEERING */

    let steering = 0;


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        steering -= 1;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        steering += 1;

    }


    player.position.x +=
        steering *
        STEERING *
        (0.4 + speed);


    /*
       Keep player on road.
    */

    player.position.x =
        THREE.MathUtils.clamp(
            player.position.x,
            -9,
            9
        );


    /*
       Move forward.

       Negative Z = forward.
    */

    player.position.z -=
        speed;


    /*
       Slight body lean.
    */

    player.rotation.z =
        -steering * 0.04;


    /*
       Camera.
    */

    updateCamera();


    /*
       Score.
    */

    score +=
        speed * delta * 60;


    updateHUD();

}


/* =========================================================
   TRAFFIC MOVEMENT
========================================================= */

function updateTraffic() {

    for (
        const vehicle of traffic
    ) {

        vehicle.position.z +=
            vehicle.userData.speed -
            speed;


        /*
           Recycle traffic once
           it passes the player.
        */

        if (
            vehicle.position.z >
            player.position.z + 40
        ) {

            vehicle.position.z =
                player.position.z -
                250 -
                Math.random() *
                250;


            const lanes = [
                -7,
                -2.5,
                2.5,
                7
            ];


            vehicle.position.x =
                lanes[
                    Math.floor(
                        Math.random() *
                        lanes.length
                    )
                ];

        }

    }

}


/* =========================================================
   COLLISION
========================================================= */

function checkCollisions() {

    if (
        !player ||
        crashed
    ) {

        return;

    }


    const playerBox =
        new THREE.Box3()
            .setFromObject(
                player
            );


    /*
       Make collision box
       slightly smaller than model.
    */

    playerBox.expandByScalar(
        -0.4
    );


    for (
        const vehicle of traffic
    ) {

        const trafficBox =
            new THREE.Box3()
                .setFromObject(
                    vehicle
                );


        trafficBox.expandByScalar(
            -0.3
        );


        if (
            playerBox.intersectsBox(
                trafficBox
            )
        ) {

            crash();

            return;

        }

    }

}


/* =========================================================
   CAMERA
========================================================= */

function updateCamera() {

    if (
        !player
    ) {

        return;

    }


    const desiredPosition =
        new THREE.Vector3(
            player.position.x * 0.45,
            5.2,
            player.position.z + 11
        );


    camera.position.lerp(
        desiredPosition,
        0.08
    );


    const lookTarget =
        new THREE.Vector3(
            player.position.x,
            1.2,
            player.position.z - 25
        );


    camera.lookAt(
        lookTarget
    );

}


/* =========================================================
   HUD
========================================================= */

function updateHUD() {

    document.getElementById(
        "speed"
    ).textContent =
        Math.round(
            speed * 160
        );


    document.getElementById(
        "score"
    ).textContent =
        Math.floor(
            score
        );

}


/* =========================================================
   START GAME
========================================================= */

function startGame() {

    gameStarted =
        true;

    crashed =
        false;

    speed =
        0;

    score =
        0;


    document.getElementById(
        "menu"
    ).style.display =
        "none";


    document.getElementById(
        "hud"
    ).style.display =
        "block";

}


/* =========================================================
   CRASH
========================================================= */

function crash() {

    crashed =
        true;

    speed =
        0;


    document.getElementById(
        "final-score"
    ).textContent =
        Math.floor(
            score
        );


    document.getElementById(
        "game-over"
    ).style.display =
        "flex";

}


/* =========================================================
   RESTART
========================================================= */

function restartGame() {

    crashed =
        false;

    speed =
        0;

    score =
        0;


    player.position.set(
        0,
        0,
        PLAYER_Z
    );


    traffic.forEach(
        (vehicle, index) => {

            vehicle.position.z =
                -100 -
                index * 100;

        }
    );


    document.getElementById(
        "game-over"
    ).style.display =
        "none";


    document.getElementById(
        "hud"
    ).style.display =
        "block";

}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;


        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );

    }
);


/* =========================================================
   GAME LOOP
========================================================= */

function animate(
    currentTime
) {

    requestAnimationFrame(
        animate
    );


    const delta =
        Math.min(
            (currentTime -
            lastTime) /
            1000,
            0.05
        );


    lastTime =
        currentTime;


    if (
        gameStarted &&
        !crashed
    ) {

        updatePlayer(
            delta
        );

        updateTraffic();

        checkCollisions();

    }


    renderer.render(
        scene,
        camera
    );

}


/* =========================================================
   INITIALIZATION
========================================================= */

async function initialize() {

    try {

        document.getElementById(
            "loading-text"
        ).textContent =
            "Initializing 3D engine...";


        initThree();


        document.getElementById(
            "loading-progress"
        ).style.width =
            "25%";


        await loadPlayer();


        document.getElementById(
            "loading-progress"
        ).style.width =
            "70%";


        document.getElementById(
            "loading-text"
        ).textContent =
            "Loading traffic...";


        loadTraffic();


        document.getElementById(
            "loading-progress"
        ).style.width =
            "100%";


        document.getElementById(
            "loading-text"
        ).textContent =
            "Ready!";


        setTimeout(
            () => {

                document.getElementById(
                    "loading"
                ).style.display =
                    "none";


                document.getElementById(
                    "menu"
                ).style.display =
                    "flex";

            },
            700
        );


    }
    catch (error) {

        console.error(
            "GAME INITIALIZATION FAILED:",
            error
        );


        document.getElementById(
            "loading-text"
        ).textContent =
            "Could not load car.glb";


        document.getElementById(
            "loading-text"
        ).style.color =
            "#ff5555";

    }

}

initialize();

animate(

);
