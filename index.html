<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CyberRacer 3D - Highway Overdrive</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    canvas { width: 100vw; height: 100vh; display: block; }
    
    /* HUD UI */
    #hud {
      position: absolute;
      top: 20px;
      left: 20px;
      display: flex;
      gap: 15px;
      pointer-events: none;
      z-index: 10;
    }
    .card {
      background: rgba(10, 15, 25, 0.75);
      border: 1px solid rgba(0, 255, 200, 0.3);
      backdrop-filter: blur(8px);
      padding: 10px 18px;
      border-radius: 8px;
      color: #fff;
    }
    .card-title { font-size: 10px; color: #00ffcc; text-transform: uppercase; letter-spacing: 1.5px; }
    .card-val { font-size: 24px; font-weight: bold; color: #fff; text-shadow: 0 0 10px #00ffcc; }

    #controls-tip {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.6);
      border: 1px solid rgba(255,255,255,0.2);
      color: #ccc;
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 12px;
      pointer-events: none;
    }
    #controls-tip span { color: #00ffcc; font-weight: bold; }

    /* Game Over Modal */
    #game-over {
      display: none;
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(15, 5, 10, 0.92);
      border: 2px solid #ff0055;
      box-shadow: 0 0 30px rgba(255, 0, 85, 0.5);
      padding: 30px 40px;
      text-align: center;
      border-radius: 12px;
      z-index: 100;
      color: white;
    }
    #game-over h1 { color: #ff0055; font-size: 36px; margin-bottom: 10px; letter-spacing: 2px; }
    #restart-btn {
      margin-top: 20px;
      background: #00ffcc;
      color: #000;
      border: none;
      padding: 12px 30px;
      font-size: 16px;
      font-weight: bold;
      border-radius: 6px;
      cursor: pointer;
      transition: 0.2s;
    }
    #restart-btn:hover { background: #ff0055; color: #fff; box-shadow: 0 0 15px #ff0055; }
  </style>

  <!-- Load official Three.js Bundle -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div id="hud">
    <div class="card">
      <div class="card-title">Speed</div>
      <div class="card-val"><span id="speed-display">0</span> <span style="font-size: 12px;">KM/H</span></div>
    </div>
    <div class="card">
      <div class="card-title">Score</div>
      <div class="card-val" id="score-display">0</div>
    </div>
  </div>

  <div id="controls-tip">Drive: <span>[UP / DOWN]</span> | Steer: <span>[LEFT / RIGHT]</span></div>

  <div id="game-over">
    <h1>VEHICLE CRASHED!</h1>
    <p style="color:#aaa;">TOTAL SCORE</p>
    <div style="font-size: 42px; font-weight: bold; color:#00ffcc;" id="final-score">0</div>
    <button id="restart-btn" onclick="resetGame()">PLAY AGAIN</button>
  </div>

  <script>
    // --- 1. ENGINE & SCENE SETUP ---
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x020208);
    scene.fog = new THREE.FogExp2(0x020208, 0.008);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);

    // --- 2. REALISTIC LIGHTS ---
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.7);
    scene.add(ambientLight);

    const sun = new THREE.DirectionalLight(0xffffff, 1.2);
    sun.position.set(50, 80, 50);
    sun.castShadow = true;
    sun.shadow.mapSize.width = 2048;
    sun.shadow.mapSize.height = 2048;
    scene.add(sun);

    // --- 3. ENVIRONMENT & ROAD ---
    const roadWidth = 20;
    const roadLength = 2000;

    // Asphalt Track
    const roadGeo = new THREE.PlaneGeometry(roadWidth, roadLength);
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x15151e, roughness: 0.7 });
    const road = new THREE.Mesh(roadGeo, roadMat);
    road.rotation.x = -Math.PI / 2;
    road.receiveShadow = true;
    scene.add(road);

    // Guard Rails (Metallic Left/Right)
    const railGeo = new THREE.BoxGeometry(0.4, 1.2, roadLength);
    const railMat = new THREE.MeshStandardMaterial({ color: 0x778899, metalness: 0.9, roughness: 0.2 });
    
    const railL = new THREE.Mesh(railGeo, railMat);
    railL.position.set(-roadWidth / 2 - 0.2, 0.6, 0);
    scene.add(railL);

    const railR = new THREE.Mesh(railGeo, railMat);
    railR.position.set(roadWidth / 2 + 0.2, 0.6, 0);
    scene.add(railR);

    // Road Markings
    const laneMarkers = [];
    const markerGeo = new THREE.PlaneGeometry(0.4, 6);
    const markerMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    for (let i = 0; i < 80; i++) {
      [-4, 4].forEach(x => {
        const m = new THREE.Mesh(markerGeo, markerMat);
        m.rotation.x = -Math.PI / 2;
        m.position.set(x, 0.02, -i * 25);
        scene.add(m);
        laneMarkers.push(m);
      });
    }

    // Street Lamps
    const streetLamps = [];
    const poleGeo = new THREE.CylinderGeometry(0.12, 0.15, 10);
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x222233, metalness: 0.8 });
    const glowMat = new THREE.MeshBasicMaterial({ color: 0x00ffcc });

    for(let i = 0; i < 40; i++) {
      [-roadWidth/2 - 2, roadWidth/2 + 2].forEach(x => {
        const pole = new THREE.Mesh(poleGeo, poleMat);
        pole.position.set(x, 5, -i * 50);
        
        const bulb = new THREE.Mesh(new THREE.BoxGeometry(1, 0.3, 0.5), glowMat);
        bulb.position.set(x > 0 ? -0.5 : 0.5, 5, 0);
        pole.add(bulb);

        scene.add(pole);
        streetLamps.push(pole);
      });
    }

    // --- 4. DETAILED 3D SPORTS CAR BUILDER ---
    function buildSportsCar(colorHex) {
      const car = new THREE.Group();

      const bodyMat = new THREE.MeshStandardMaterial({ color: colorHex, metalness: 0.8, roughness: 0.2 });
      const glassMat = new THREE.MeshStandardMaterial({ color: 0x050505, metalness: 0.9, roughness: 0.1, transparent: true, opacity: 0.8 });
      const tireMat = new THREE.MeshStandardMaterial({ color: 0x111111, roughness: 0.9 });
      const rimMat = new THREE.MeshStandardMaterial({ color: 0xdddddd, metalness: 0.9, roughness: 0.1 });

      // Lower Chassis
      const body = new THREE.Mesh(new THREE.BoxGeometry(2.2, 0.6, 4.6), bodyMat);
      body.position.y = 0.5;
      body.castShadow = true;
      car.add(body);

      // Cabin Roof
      const roof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 0.55, 2.3), glassMat);
      roof.position.set(0, 1.0, -0.1);
      car.add(roof);

      // Hood Slope
      const hood = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.25, 1.4), bodyMat);
      hood.position.set(0, 0.6, -1.4);
      hood.rotation.x = 0.1;
      car.add(hood);

      // Rear Wing
      const wing = new THREE.Mesh(new THREE.BoxGeometry(2.3, 0.08, 0.4), bodyMat);
      wing.position.set(0, 1.15, 2.1);
      car.add(wing);

      // Headlights & Taillights
      const hl = new THREE.Mesh(new THREE.BoxGeometry(0.5, 0.15, 0.1), new THREE.MeshBasicMaterial({ color: 0xffffff }));
      hl.position.set(-0.7, 0.55, -2.31);
      const hr = hl.clone(); hr.position.x = 0.7;
      car.add(hl, hr);

      const tail = new THREE.Mesh(new THREE.BoxGeometry(2.0, 0.12, 0.1), new THREE.MeshBasicMaterial({ color: 0xff0033 }));
      tail.position.set(0, 0.65, 2.31);
      car.add(tail);

      // 4 Wheels
      const wheelGeo = new THREE.CylinderGeometry(0.42, 0.42, 0.35, 24);
      wheelGeo.rotateZ(Math.PI / 2);

      const wheels = [];
      const wheelPositions = [
        [-1.15, 0.42, -1.4], [1.15, 0.42, -1.4], // Front
        [-1.15, 0.42, 1.4],  [1.15, 0.42, 1.4]   // Rear
      ];

      wheelPositions.forEach((pos, idx) => {
        const pGroup = new THREE.Group();
        pGroup.position.set(...pos);

        const wMesh = new THREE.Mesh(wheelGeo, tireMat);
        wMesh.castShadow = true;
        pGroup.add(wMesh);

        const rim = new THREE.Mesh(new THREE.BoxGeometry(0.38, 0.75, 0.08), rimMat);
        pGroup.add(rim);

        car.add(pGroup);
        wheels.push(pGroup);
      });

      return { carGroup: car, wheels: wheels };
    }

    // Player Car Setup
    const player = buildSportsCar(0x0088ff);
    const carGroup = player.carGroup;
    scene.add(carGroup);

    // --- 5. TRAFFIC CARS GENERATOR ---
    const trafficList = [];
    const lanes = [-6, 0, 6];
    const trafficColors = [0xff0055, 0xffaa00, 0x9900ff, 0x00ff88];

    function spawnTraffic(zPos) {
      const color = trafficColors[Math.floor(Math.random() * trafficColors.length)];
      const tObj = buildSportsCar(color);
      const tGroup = tObj.carGroup;

      const randomLane = lanes[Math.floor(Math.random() * lanes.length)];
      tGroup.position.set(randomLane, 0, zPos);
      
      scene.add(tGroup);
      trafficList.push({ group: tGroup, wheels: tObj.wheels });
    }

    // Initial Traffic Wave
    for (let i = 0; i < 8; i++) {
      spawnTraffic(-50 - (i * 45));
    }

    // --- 6. GAME PHYSICS & CONTROLS ---
    let speed = 0;
    let score = 0;
    let isGameOver = false;
    let steerAngle = 0;

    const maxSpeed = 1.6;
    const accel = 0.03;
    const friction = 0.96;
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false };

    window.addEventListener('keydown', e => { if (e.code in keys) keys[e.code] = true; });
    window.addEventListener('keyup', e => { if (e.code in keys) keys[e.code] = false; });

    // --- 7. MAIN GAME ANIMATION LOOP ---
    function animate() {
      if (isGameOver) return;
      requestAnimationFrame(animate);

      // Gas / Brake / Friction
      if (keys.ArrowUp) speed = Math.min(speed + accel, maxSpeed);
      else if (keys.ArrowDown) speed = Math.max(speed - accel, -maxSpeed / 2);
      else speed *= friction;

      // Steering
      const targetSteer = keys.ArrowLeft ? 0.35 : (keys.ArrowRight ? -0.35 : 0);
      steerAngle += (targetSteer - steerAngle) * 0.15;

      // Turn Front Wheel Meshes physically
      player.wheels[0].rotation.y = steerAngle;
      player.wheels[1].rotation.y = steerAngle;

      if (Math.abs(speed) > 0.01) {
        carGroup.position.x += steerAngle * speed * 0.75;
        carGroup.position.x = Math.max(-8.5, Math.min(8.5, carGroup.position.x));

        // Car Body Dynamics (Tilt into corners)
        carGroup.rotation.z = steerAngle * 0.15;
        carGroup.rotation.y = steerAngle * 0.08;
      } else {
        carGroup.rotation.z *= 0.9;
        carGroup.rotation.y *= 0.9;
      }

      // Roll Tires Forward
      player.wheels.forEach(w => w.rotation.x -= speed * 0.8);

      // Drive Car Forward
      carGroup.position.z -= speed;

      // Update Score & UI
      if (speed > 0.05) {
        score += Math.round(speed * 15);
        document.getElementById('score-display').innerText = score;
      }
      document.getElementById('speed-display').innerText = Math.round(Math.abs(speed) * 180);

      // Recycle Road Markings & Lamps for Endless Track
      laneMarkers.forEach(m => {
        if (m.position.z > carGroup.position.z + 10) m.position.z -= 1800;
      });

      streetLamps.forEach(p => {
        if (p.position.z > carGroup.position.z + 10) p.position.z -= 2000;
      });

      // Traffic AI & Collision Box Test
      trafficList.forEach(t => {
        // Spin traffic wheels slowly forward
        t.wheels.forEach(w => w.rotation.x -= 0.3);

        // Respawn traffic when passed
        if (t.group.position.z > carGroup.position.z + 15) {
          t.group.position.z = carGroup.position.z - 300 - (Math.random() * 80);
          t.group.position.x = lanes[Math.floor(Math.random() * lanes.length)];
        }

        // Hitbox Check
        const dx = Math.abs(carGroup.position.x - t.group.position.x);
        const dz = Math.abs(carGroup.position.z - t.group.position.z);

        if (dx < 2.0 && dz < 4.2) {
          triggerCrash();
        }
      });

      // Camera Smooth Follow
      camera.position.x += (carGroup.position.x - camera.position.x) * 0.1;
      camera.position.y = carGroup.position.y + 3.5;
      camera.position.z = carGroup.position.z + 8.5;
      camera.lookAt(carGroup.position.x * 0.5, carGroup.position.y + 1, carGroup.position.z - 10);

      renderer.render(scene, camera);
    }

    function triggerCrash() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'block';
    }

    function resetGame() {
      isGameOver = false;
      speed = 0;
      score = 0;
      steerAngle = 0;
      document.getElementById('score-display').innerText = '0';
      document.getElementById('game-over').style.display = 'none';

      carGroup.position.set(0, 0, 0);
      carGroup.rotation.set(0, 0, 0);

      trafficList.forEach((t, i) => {
        t.group.position.set(lanes[Math.floor(Math.random() * lanes.length)], 0, -50 - (i * 45));
      });

      animate();
    }

    // Start Engine
    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
