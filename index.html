<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sunny Highway Racer 3D - Repo Integrated</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; }
    body { overflow: hidden; background: #87ceeb; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    
    #hud {
      position: absolute; top: 20px; left: 20px; display: flex; gap: 15px; z-index: 10;
      pointer-events: none; opacity: 0; transition: opacity 0.5s ease;
    }
    .card {
      background: rgba(255, 255, 255, 0.85); border: 1px solid rgba(255, 255, 255, 0.4);
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.08); backdrop-filter: blur(12px);
      padding: 10px 20px; border-radius: 12px; color: #222;
    }
    .card-title { font-size: 11px; color: #666; font-weight: 700; text-transform: uppercase; letter-spacing: 1px; }
    .card-val { font-size: 26px; font-weight: 800; color: #111; }

    #speedometer-container {
      position: absolute; bottom: 25px; left: 25px; width: 160px; height: 160px;
      background: rgba(18, 22, 31, 0.85); border: 2px solid rgba(255, 255, 255, 0.2);
      border-radius: 50%; box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35); backdrop-filter: blur(10px);
      display: flex; justify-content: center; align-items: center; z-index: 10;
      pointer-events: none; opacity: 0; transition: opacity 0.5s ease;
    }

    #loading-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: #87ceeb;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      color: #1a365d; font-size: 22px; font-weight: bold; z-index: 200; transition: opacity 0.5s ease;
      text-align: center; padding: 20px;
    }

    #showroom-ui {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.92); border: 1px solid rgba(255, 255, 255, 0.6);
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.2); backdrop-filter: blur(16px);
      padding: 35px 45px; text-align: center; border-radius: 20px; z-index: 100; color: #222;
    }
    #showroom-ui h1 { font-size: 32px; font-weight: 900; color: #1a73e8; margin-bottom: 4px; }
    #showroom-ui p { color: #666; font-size: 13px; margin-bottom: 20px; }
    
    .garage-controls { display: flex; align-items: center; justify-content: center; gap: 20px; margin-bottom: 24px; }
    .nav-btn {
      background: #e8f0fe; color: #1a73e8; border: none; width: 44px; height: 44px;
      border-radius: 50%; font-size: 20px; font-weight: bold; cursor: pointer; transition: all 0.2s;
    }
    .nav-btn:hover { background: #1a73e8; color: #fff; }
    .car-name { font-size: 18px; font-weight: 800; min-width: 140px; color: #333; }

    .primary-btn {
      background: #1a73e8; color: #fff; border: none; padding: 14px 36px; font-size: 17px;
      font-weight: 800; border-radius: 12px; cursor: pointer; box-shadow: 0 6px 20px rgba(26, 115, 232, 0.4);
      transition: all 0.2s ease;
    }
    .primary-btn:hover { background: #1557b0; transform: translateY(-2px); }

    #game-over {
      display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
      background: rgba(255, 255, 255, 0.95); box-shadow: 0 10px 40px rgba(0, 0, 0, 0.2);
      padding: 35px 45px; text-align: center; border-radius: 16px; z-index: 100; color: #222;
    }
    #game-over h1 { color: #d93025; font-size: 32px; margin-bottom: 8px; }
  </style>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
</head>
<body>

  <div id="loading-screen">
    <div id="loading-text">LOADING REPOSITORY ASSETS...</div>
  </div>

  <div id="showroom-ui">
    <h1>GARAGE SELECT</h1>
    <p>CHOOSE YOUR RIDE</p>
    <div class="garage-controls">
      <button class="nav-btn" onclick="cycleCar(-1)">&#10094;</button>
      <div class="car-name" id="car-title">Car (1)</div>
      <button class="nav-btn" onclick="cycleCar(1)">&#10095;</button>
    </div>
    <button class="primary-btn" onclick="startGame()">START DRIVE</button>
  </div>

  <div id="hud">
    <div class="card">
      <div class="card-title">Score</div>
      <div class="card-val" id="score-display">0</div>
    </div>
  </div>

  <div id="speedometer-container">
    <canvas id="speedo-canvas" width="160" height="160"></canvas>
  </div>

  <div id="game-over">
    <h1>CRASHED!</h1>
    <p style="color:#666; font-size: 14px;">FINAL SCORE</p>
    <div style="font-size: 44px; font-weight: 800; color:#1a73e8; margin: 10px 0;" id="final-score">0</div>
    <button class="primary-btn" onclick="resetGame()">DRIVE AGAIN</button>
  </div>

  <script>
    // Asset Lists matched directly to your repository
    const carFiles = ['Car (1).glb', 'Car (3).glb', 'Car (6).glb', 'Car (7).glb', 'car.glb'];
    const buildingFiles = [
      'Building (1).glb', 'Building (2).glb', 'Building (3).glb', 'Building (4).glb',
      'Building (5).glb', 'Building (6).glb', 'Building (7).glb', 'Building (8).glb',
      'Building (9).glb', 'Building (10).glb', 'Building (11).glb', 'Building (12).glb',
      'Building (13).glb', 'Building (14).glb', 'Building (19).glb', 'Building (20).glb',
      'Building (24).glb'
    ];
    const treeFiles = ['Tree (2).glb', 'Tree (3).glb', 'Tree (4).glb', 'Tree (5).glb', 'Tree (6).glb', 'Tree (8).glb'];
    const trafficFiles = ['T-vehicle (1).glb', 'T-vehicle (2).glb', 'T-vehicle (3).glb'];
    const planeFiles = ['Aeroplane (1).glb', 'Aeroplane (2).glb', 'Aeroplane (3).glb'];

    let currentCarIdx = 0;
    const loadedCarModels = {};

    // Scene & Renderer Setup
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x87ceeb);
    scene.fog = new THREE.FogExp2(0x87ceeb, 0.002);

    const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    document.body.appendChild(renderer.domElement);

    // Lighting
    const hemiLight = new THREE.HemisphereLight(0xffffff, 0x444444, 1.2);
    hemiLight.position.set(0, 50, 0);
    scene.add(hemiLight);

    const dirLight = new THREE.DirectionalLight(0xfffaed, 2.0);
    dirLight.position.set(50, 80, -40);
    dirLight.castShadow = true;
    dirLight.shadow.mapSize.width = 2048;
    dirLight.shadow.mapSize.height = 2048;
    scene.add(dirLight);

    // Terrain & Math
    function getTerrainHeight(z) { return Math.sin(z * 0.012) * 14 + Math.cos(z * 0.005) * 8; }
    function getTerrainSlope(z) { const d = 0.1; return (getTerrainHeight(z - d) - getTerrainHeight(z + d)) / (2 * d); }

    // Road Track Generation
    const roadWidth = 22, chunkLength = 100, totalChunks = 20;
    const roadChunks = [], grassChunks = [];
    const roadMat = new THREE.MeshStandardMaterial({ color: 0x333639, roughness: 0.8 });
    const grassMat = new THREE.MeshStandardMaterial({ color: 0x5a8247, roughness: 0.9 });

    function createChunk(w, mat, isGrass=false) {
      const geo = new THREE.PlaneGeometry(w, chunkLength, 1, 30);
      geo.rotateX(-Math.PI / 2);
      const mesh = new THREE.Mesh(geo, mat);
      mesh.receiveShadow = true;
      if(isGrass) mesh.position.y = -0.05;
      scene.add(mesh);
      return mesh;
    }

    function updateChunk(mesh, startZ) {
      const pos = mesh.geometry.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        const localZ = pos.getZ(i);
        const globalZ = startZ - localZ - (chunkLength / 2);
        pos.setY(i, getTerrainHeight(globalZ));
      }
      mesh.geometry.computeVertexNormals();
      mesh.geometry.attributes.position.needsUpdate = true;
      mesh.position.z = startZ - (chunkLength / 2);
    }

    for (let i = 0; i < totalChunks; i++) {
      const r = createChunk(roadWidth, roadMat);
      const g = createChunk(400, grassMat, true);
      updateChunk(r, -i * chunkLength);
      updateChunk(g, -i * chunkLength);
      roadChunks.push(r); grassChunks.push(g);
    }

    // Player Vehicle Manager
    const playerGroup = new THREE.Group();
    scene.add(playerGroup);
    const gltfLoader = new THREE.GLTFLoader();

    function prepareModelPivot(model, targetLen=4.5) {
      const bbox = new THREE.Box3().setFromObject(model);
      const size = bbox.getSize(new THREE.Vector3());
      const scale = targetLen / Math.max(size.x, size.y, size.z);
      model.scale.set(scale, scale, scale);

      bbox.setFromObject(model);
      const center = bbox.getCenter(new THREE.Vector3());
      model.position.x = -center.x;
      model.position.z = -center.z;
      model.position.y = -bbox.min.y; // Precision ground contact alignment
      model.rotation.y = Math.PI;

      model.traverse(c => { if(c.isMesh) { c.castShadow = true; c.receiveShadow = true; } });
      return model;
    }

    let loadedCount = 0;
    carFiles.forEach((file, index) => {
      gltfLoader.load(`./${file}`, (gltf) => {
        const processed = prepareModelPivot(gltf.scene);
        loadedCarModels[index] = processed;
        loadedCount++;
        
        if (index === 0) playerGroup.add(processed);

        if (loadedCount === carFiles.length) {
          const loader = document.getElementById('loading-screen');
          loader.style.opacity = '0';
          setTimeout(() => {
            loader.style.display = 'none';
            document.getElementById('showroom-ui').style.display = 'block';
          }, 500);
        }
      }, undefined, () => {
        loadedCount++;
        if (loadedCount === carFiles.length) {
          document.getElementById('loading-screen').style.display = 'none';
          document.getElementById('showroom-ui').style.display = 'block';
        }
      });
    });

    function cycleCar(dir) {
      if (carFiles.length === 0) return;
      playerGroup.remove(loadedCarModels[currentCarIdx]);
      currentCarIdx = (currentCarIdx + dir + carFiles.length) % carFiles.length;
      if (loadedCarModels[currentCarIdx]) {
        playerGroup.add(loadedCarModels[currentCarIdx]);
      }
      document.getElementById('car-title').innerText = carFiles[currentCarIdx].replace('.glb', '');
    }

    // Dynamic Traffic Systems
    const trafficList = [];
    const lanes = [-7, -2.5, 2.5, 7];

    function spawnTraffic(zPos) {
      const group = new THREE.Group();
      const randFile = trafficFiles[Math.floor(Math.random() * trafficFiles.length)];
      
      gltfLoader.load(`./${randFile}`, (gltf) => {
        const m = prepareModelPivot(gltf.scene, 4.2);
        group.add(m);
      }, undefined, () => {
        const fallback = new THREE.Mesh(new THREE.BoxGeometry(2, 1.2, 4), new THREE.MeshStandardMaterial({color: 0xcc3333}));
        fallback.position.y = 0.6;
        group.add(fallback);
      });

      const lane = lanes[Math.floor(Math.random() * lanes.length)];
      group.position.set(lane, getTerrainHeight(zPos), zPos);
      group.userData = { speed: 0.35 + Math.random() * 0.2, targetX: lane, width: 2.0, length: 4.2 };
      
      scene.add(group);
      trafficList.push(group);
    }

    for (let i = 0; i < 8; i++) spawnTraffic(-80 - (i * 60));

    // Dynamic Environment Spawning (Buildings & Trees)
    const sceneryObjects = [];
    function spawnScenery(fileList, xPos, zPos, scaleRange) {
      const file = fileList[Math.floor(Math.random() * fileList.length)];
      gltfLoader.load(`./${file}`, (gltf) => {
        const m = gltf.scene;
        const s = scaleRange[0] + Math.random() * (scaleRange[1] - scaleRange[0]);
        m.scale.set(s, s, s);
        m.position.set(xPos, getTerrainHeight(zPos), zPos);
        m.userData = { relZ: zPos, offsetX: xPos };
        scene.add(m);
        sceneryObjects.push(m);
      });
    }

    for(let i = 0; i < 25; i++) {
      spawnScenery(buildingFiles, -26, -i * 50, [1.5, 2.2]);
      spawnScenery(buildingFiles, 26, -i * 50 - 25, [1.5, 2.2]);
      spawnScenery(treeFiles, -16, -i * 35, [1.0, 1.8]);
      spawnScenery(treeFiles, 16, -i * 35 - 15, [1.0, 1.8]);
    }

    // Overhead Planes
    const activePlanes = [];
    function spawnAirplane() {
      const file = planeFiles[Math.floor(Math.random() * planeFiles.length)];
      gltfLoader.load(`./${file}`, (gltf) => {
        const p = gltf.scene;
        p.scale.set(3, 3, 3);
        p.position.set(100, 60, playerGroup.position.z - 400);
        scene.add(p);
        activePlanes.push(p);
      });
    }
    setInterval(spawnAirplane, 18000);

    // Speedometer UI Canvas
    const speedoCanvas = document.getElementById('speedo-canvas');
    const ctx = speedoCanvas.getContext('2d');
    function drawSpeedo(km) {
      ctx.clearRect(0, 0, 160, 160);
      ctx.beginPath(); ctx.arc(80, 80, 60, 0.75 * Math.PI, 2.25 * Math.PI);
      ctx.lineWidth = 8; ctx.strokeStyle = '#2c3e50'; ctx.stroke();
      
      const pct = Math.min(Math.max(km / 180, 0), 1);
      const angle = 0.75 * Math.PI + (pct * 1.5 * Math.PI);
      
      ctx.beginPath(); ctx.arc(80, 80, 60, 0.75 * Math.PI, angle);
      ctx.lineWidth = 8; ctx.strokeStyle = pct > 0.7 ? '#ff3b30' : '#34c759'; ctx.stroke();
      
      ctx.fillStyle = '#fff'; ctx.font = 'bold 20px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(Math.round(km), 80, 105);
      ctx.fillStyle = '#8e8e93'; ctx.font = '700 9px sans-serif';
      ctx.fillText('KM/H', 80, 118);
    }

    // Driving Physics & State Engine
    let isGameStarted = false, isGameOver = false;
    let speed = 0, score = 0, sideVel = 0, currentYaw = 0, currentRoll = 0, showroomTime = 0;
    const maxSpeed = 1.6, accel = 0.02, decel = 0.03, friction = 0.985;
    const keys = { ArrowUp: false, ArrowDown: false, ArrowLeft: false, ArrowRight: false, KeyW: false, KeyS: false, KeyA: false, KeyD: false };

    window.addEventListener('keydown', e => { if (e.code in keys) keys[e.code] = true; });
    window.addEventListener('keyup', e => { if (e.code in keys) keys[e.code] = false; });

    function startGame() {
      document.getElementById('showroom-ui').style.display = 'none';
      document.getElementById('hud').style.opacity = '1';
      document.getElementById('speedometer-container').style.opacity = '1';
      isGameStarted = true;
    }

    function animate() {
      requestAnimationFrame(animate);

      if (!isGameStarted) {
        showroomTime += 0.015;
        const radius = 8;
        const groundY = getTerrainHeight(playerGroup.position.z);
        camera.position.x = Math.sin(showroomTime) * radius;
        camera.position.z = Math.cos(showroomTime) * radius + playerGroup.position.z;
        camera.position.y = groundY + 2.5;
        camera.lookAt(playerGroup.position.x, groundY + 0.8, playerGroup.position.z);
        renderer.render(scene, camera);
        return;
      }

      if (isGameOver) return;

      // Controls & Acceleration
      const throttle = keys.ArrowUp || keys.KeyW;
      const brake = keys.ArrowDown || keys.KeyS;
      const left = keys.ArrowLeft || keys.KeyA;
      const right = keys.ArrowRight || keys.KeyD;

      if (throttle) speed = Math.min(speed + accel, maxSpeed);
      else if (brake) speed = Math.max(speed - decel, -maxSpeed / 3);
      else speed *= friction;

      // Lateral Turning Dynamics
      const turnPower = 0.08 * (Math.abs(speed) / maxSpeed + 0.3);
      if (left) sideVel -= turnPower;
      else if (right) sideVel += turnPower;
      else sideVel *= 0.82;

      sideVel = Math.max(-0.6, Math.min(0.6, sideVel));

      if (Math.abs(speed) > 0.005) {
        playerGroup.position.x += sideVel;
        playerGroup.position.x = Math.max(-9.2, Math.min(9.2, playerGroup.position.x));
        currentYaw += (-sideVel * 0.8 - currentYaw) * 0.15;
        currentRoll += (sideVel * 0.3 - currentRoll) * 0.15;
        playerGroup.rotation.y = currentYaw;
        playerGroup.rotation.z = currentRoll;
      }

      playerGroup.position.z -= speed;

      // Terrain Lock & Pitch Alignment
      const groundY = getTerrainHeight(playerGroup.position.z);
      const slope = getTerrainSlope(playerGroup.position.z);
      playerGroup.position.y = groundY;
      playerGroup.rotation.x = -Math.atan(slope);

      // Road Tiling Recycling
      roadChunks.forEach((chunk, index) => {
        if (chunk.position.z - (chunkLength / 2) > playerGroup.position.z + 20) {
          const newStartZ = chunk.position.z + (chunkLength / 2) - (totalChunks * chunkLength);
          updateChunk(chunk, newStartZ);
          updateChunk(grassChunks[index], newStartZ);
        }
      });

      // Traffic AI & Collision System
      trafficList.forEach(t => {
        t.position.z -= t.userData.speed;
        t.position.y = getTerrainHeight(t.position.z);
        t.rotation.x = -Math.atan(getTerrainSlope(t.position.z));

        if (t.position.z > playerGroup.position.z + 20) {
          t.position.z = playerGroup.position.z - 300 - (Math.random() * 80);
          t.position.x = lanes[Math.floor(Math.random() * lanes.length)];
        }

        const dx = Math.abs(playerGroup.position.x - t.position.x);
        const dz = Math.abs(playerGroup.position.z - t.position.z);
        if (dx < 1.8 && dz < 3.8) triggerCrash();
      });

      // Scenery Recycling
      sceneryObjects.forEach(obj => {
        let absZ = playerGroup.position.z + (obj.userData.relZ % 1200);
        if (absZ > playerGroup.position.z + 30) absZ -= 1200;
        obj.position.set(obj.userData.offsetX, getTerrainHeight(absZ), absZ);
        obj.rotation.x = -Math.atan(getTerrainSlope(absZ));
      });

      // Flyby Aircraft Loop
      activePlanes.forEach((plane, idx) => {
        plane.position.x -= 1.2;
        plane.position.z -= 0.5;
        if (plane.position.x < -300) {
          scene.remove(plane);
          activePlanes.splice(idx, 1);
        }
      });

      if (speed > 0.02) {
        score += Math.round(speed * 8);
        document.getElementById('score-display').innerText = score;
      }

      drawSpeedo(Math.abs(speed) * 110);

      // Smooth Camera Tracking
      const camX = playerGroup.position.x * 0.7;
      const camY = playerGroup.position.y + 3.5 + (speed * 0.5);
      const camZ = playerGroup.position.z + 8.5 + (speed * 1.2);

      camera.position.x += (camX - camera.position.x) * 0.1;
      camera.position.y += (camY - camera.position.y) * 0.1;
      camera.position.z += (camZ - camera.position.z) * 0.1;
      camera.lookAt(playerGroup.position.x * 0.3, playerGroup.position.y + 1.0, playerGroup.position.z - 12);

      renderer.render(scene, camera);
    }

    function triggerCrash() {
      isGameOver = true;
      document.getElementById('final-score').innerText = score;
      document.getElementById('game-over').style.display = 'block';
    }

    function resetGame() {
      isGameOver = false; speed = 0; score = 0; sideVel = 0;
      document.getElementById('score-display').innerText = '0';
      document.getElementById('game-over').style.display = 'none';
      playerGroup.position.set(0, getTerrainHeight(0), 0);
      trafficList.forEach((t, i) => {
        const lane = lanes[Math.floor(Math.random() * lanes.length)];
        t.position.set(lane, getTerrainHeight(-60 - i * 55), -60 - i * 55);
      });
    }

    animate();

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
