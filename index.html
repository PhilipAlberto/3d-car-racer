<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sunny Highway Racer 3D</title>

<style>
* {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    user-select: none;
}

html,
body {
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #9fc8ee;
    font-family:
        Inter,
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;
}

canvas {
    display: block;
}

/* =========================
   LOADING SCREEN
========================= */

#loading-screen {
    position: fixed;
    inset: 0;
    z-index: 999;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;

    background:
        radial-gradient(
            circle at center,
            #18395c 0%,
            #081522 60%,
            #03080d 100%
        );

    color: white;
    transition: opacity 0.6s ease;
}

.loading-title {
    font-size: clamp(34px, 6vw, 72px);
    font-weight: 900;
    letter-spacing: 5px;
    text-align: center;
}

.loading-subtitle {
    margin-top: 12px;
    color: #8eb9df;
    font-size: 13px;
    letter-spacing: 3px;
}

.loading-bar {
    margin-top: 35px;
    width: min(420px, 75vw);
    height: 5px;
    background: rgba(255,255,255,0.12);
    border-radius: 10px;
    overflow: hidden;
}

#loading-progress {
    width: 0%;
    height: 100%;
    background: #35a7ff;
    transition: width 0.25s ease;
}

#loading-status {
    margin-top: 14px;
    font-size: 12px;
    color: #8ca8bd;
}

/* =========================
   GARAGE
========================= */

#garage {
    position: fixed;
    inset: 0;
    z-index: 200;
    display: none;

    background:
        linear-gradient(
            135deg,
            rgba(3,10,17,0.97),
            rgba(9,30,48,0.95)
        );

    color: white;
}

.garage-header {
    position: absolute;
    top: 35px;
    left: 45px;
}

.garage-title {
    font-size: clamp(32px, 5vw, 64px);
    font-weight: 900;
    letter-spacing: 3px;
}

.garage-title span {
    color: #39a9ff;
}

.garage-caption {
    margin-top: 5px;
    color: #8da9bb;
    letter-spacing: 3px;
    font-size: 11px;
}

#garage-preview {
    position: absolute;
    left: 50%;
    top: 47%;
    width: min(70vw, 800px);
    height: min(55vh, 500px);
    transform: translate(-50%, -50%);
}

.car-name {
    position: absolute;
    left: 50%;
    bottom: 105px;
    transform: translateX(-50%);
    text-align: center;
    white-space: nowrap;
}

.car-name h2 {
    font-size: 28px;
    font-weight: 800;
}

.car-name p {
    margin-top: 5px;
    color: #7794a8;
    font-size: 12px;
    letter-spacing: 2px;
}

.garage-controls {
    position: absolute;
    bottom: 35px;
    left: 50%;
    transform: translateX(-50%);

    display: flex;
    align-items: center;
    gap: 14px;
}

.garage-btn,
.start-btn {
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 12px;
    padding: 14px 22px;
    color: white;
    background: rgba(255,255,255,0.07);
    cursor: pointer;
    font-weight: 800;
    transition: 0.2s ease;
}

.garage-btn:hover {
    background: rgba(255,255,255,0.14);
    transform: translateY(-2px);
}

.start-btn {
    background: #168df0;
    border-color: #168df0;
    padding: 15px 30px;
    box-shadow: 0 8px 30px rgba(22,141,240,0.3);
}

.start-btn:hover {
    background: #36a4ff;
    transform: translateY(-2px);
}

#car-counter {
    min-width: 80px;
    text-align: center;
    color: #91abc0;
    font-size: 12px;
}

/* =========================
   HUD
========================= */

#hud {
    position: fixed;
    inset: 0;
    z-index: 50;
    pointer-events: none;
    display: none;
}

.hud-top {
    position: absolute;
    top: 22px;
    left: 22px;
    display: flex;
    gap: 10px;
}

.hud-card {
    min-width: 130px;
    padding: 11px 17px;

    background: rgba(5,13,21,0.72);
    border: 1px solid rgba(255,255,255,0.12);
    border-radius: 11px;

    backdrop-filter: blur(12px);
}

.hud-label {
    color: #7590a5;
    font-size: 9px;
    font-weight: 800;
    letter-spacing: 2px;
}

.hud-value {
    margin-top: 3px;
    color: white;
    font-size: 22px;
    font-weight: 900;
}

#speedometer {
    position: absolute;
    left: 25px;
    bottom: 25px;

    width: 170px;
    height: 170px;

    border-radius: 50%;
    background: rgba(4,10,16,0.82);
    border: 2px solid rgba(255,255,255,0.12);

    box-shadow: 0 15px 45px rgba(0,0,0,0.35);
}

#speed-canvas {
    width: 100%;
    height: 100%;
}

.controls-help {
    position: absolute;
    right: 22px;
    bottom: 22px;

    padding: 10px 14px;
    background: rgba(4,10,16,0.65);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 10px;

    color: #91a7b7;
    font-size: 11px;
}

.controls-help b {
    color: white;
}

/* =========================
   GAME OVER
========================= */

#game-over {
    position: fixed;
    inset: 0;
    z-index: 300;

    display: none;
    justify-content: center;
    align-items: center;

    background: rgba(0,0,0,0.58);
    backdrop-filter: blur(7px);
}

.game-over-card {
    width: min(420px, 90vw);
    padding: 45px 35px;
    text-align: center;

    border-radius: 20px;
    background: rgba(8,17,27,0.96);
    border: 1px solid rgba(255,255,255,0.12);

    color: white;
}

.game-over-card h1 {
    font-size: 42px;
    color: #ff4c4c;
}

.final-score-label {
    margin-top: 12px;
    color: #7e95a7;
    font-size: 10px;
    letter-spacing: 2px;
}

#final-score {
    margin: 5px 0 25px;
    font-size: 48px;
    font-weight: 900;
}

.restart-btn {
    width: 100%;
    padding: 14px;
    border: none;
    border-radius: 10px;

    background: #168df0;
    color: white;

    font-size: 15px;
    font-weight: 800;
    cursor: pointer;
}

.restart-btn:hover {
    background: #35a7ff;
}

/* =========================
   MOBILE
========================= */

@media (max-width: 700px) {

    .garage-header {
        left: 20px;
        top: 20px;
    }

    .garage-controls {
        bottom: 20px;
    }

    .garage-btn {
        padding: 12px 15px;
    }

    .start-btn {
        padding: 12px 18px;
    }

    .hud-top {
        top: 12px;
        left: 12px;
    }

    .hud-card {
        min-width: 100px;
    }

    #speedometer {
        width: 135px;
        height: 135px;
        left: 12px;
        bottom: 12px;
    }

    .controls-help {
        display: none;
    }
}
</style>

<!-- THREE.JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- GLTF / GLB LOADER -->
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>

</head>

<body>

<!-- =========================
     LOADING
========================= -->

<div id="loading-screen">

    <div class="loading-title">
        SUNNY HIGHWAY
    </div>

    <div class="loading-subtitle">
        3D HIGHWAY RACER
    </div>

    <div class="loading-bar">
        <div id="loading-progress"></div>
    </div>

    <div id="loading-status">
        INITIALIZING ENGINE...
    </div>

</div>


<!-- =========================
     GARAGE
========================= -->

<div id="garage">

    <div class="garage-header">

        <div class="garage-title">
            SUNNY <span>HIGHWAY</span>
        </div>

        <div class="garage-caption">
            VEHICLE GARAGE
        </div>

    </div>

    <div id="garage-preview"></div>

    <div class="car-name">

        <h2 id="selected-car-name">
            STREET RACER
        </h2>

        <p id="selected-car-description">
            READY TO DRIVE
        </p>

    </div>

    <div class="garage-controls">

        <button
            class="garage-btn"
            onclick="previousCar()"
        >
            ◀
        </button>

        <div id="car-counter">
            1 / 5
        </div>

        <button
            class="garage-btn"
            onclick="nextCar()"
        >
            ▶
        </button>

        <button
            class="start-btn"
            onclick="startGame()"
        >
            START RACE
        </button>

    </div>

</div>


<!-- =========================
     HUD
========================= -->

<div id="hud">

    <div class="hud-top">

        <div class="hud-card">

            <div class="hud-label">
                SCORE
            </div>

            <div
                class="hud-value"
                id="score-display"
            >
                0
            </div>

        </div>

        <div class="hud-card">

            <div class="hud-label">
                DISTANCE
            </div>

            <div
                class="hud-value"
                id="distance-display"
            >
                0m
            </div>

        </div>

    </div>

    <div id="speedometer">

        <canvas
            id="speed-canvas"
            width="170"
            height="170"
        ></canvas>

    </div>

    <div class="controls-help">

        <b>W / ↑</b> Accelerate
        &nbsp;&nbsp;
        <b>S / ↓</b> Brake
        &nbsp;&nbsp;
        <b>A D / ← →</b> Steer

    </div>

</div>


<!-- =========================
     GAME OVER
========================= -->

<div id="game-over">

    <div class="game-over-card">

        <h1>CRASHED</h1>

        <div class="final-score-label">
            FINAL SCORE
        </div>

        <div id="final-score">
            0
        </div>

        <button
            class="restart-btn"
            onclick="resetGame()"
        >
            DRIVE AGAIN
        </button>

    </div>

</div>


<script>

/* ============================================================
   SUNNY HIGHWAY RACER
   Asset-integrated version
============================================================ */


/* ============================================================
   1. GLOBALS
============================================================ */

const loader = new THREE.GLTFLoader();

let scene;
let camera;
let renderer;

let playerGroup;
let playerModel = null;

let gameStarted = false;
let gameOver = false;
let modelReady = false;

let speed = 0;
let score = 0;
let distance = 0;

let selectedCarIndex = 0;

const clock = new THREE.Clock();


/* ============================================================
   2. AVAILABLE CARS
============================================================ */

const CAR_ASSETS = [

    {
        name: "Street Racer",
        file: "./car.glb",
        description: "DEFAULT PERFORMANCE VEHICLE"
    },

    {
        name: "Racer 01",
        file: "./Car (1).glb",
        description: "HIGH PERFORMANCE COUPE"
    },

    {
        name: "Racer 03",
        file: "./Car (3).glb",
        description: "SPORT PERFORMANCE VEHICLE"
    },

    {
        name: "Racer 06",
        file: "./Car (6).glb",
        description: "HIGH SPEED ROAD MACHINE"
    },

    {
        name: "Racer 07",
        file: "./Car (7).glb",
        description: "ADVANCED STREET RACER"
    }

];


/* ============================================================
   3. TRAFFIC ASSETS
============================================================ */

const TRAFFIC_ASSETS = [

    "./T-vehicle (1).glb",
    "./T-vehicle (2).glb",
    "./T-vehicle (3).glb"

];


/* ============================================================
   4. BUILDINGS
============================================================ */

const BUILDING_ASSETS = [

    "./Building (1).glb",
    "./Building (2).glb",
    "./Building (3).glb",
    "./Building (4).glb",
    "./Building (5).glb",
    "./Building (6).glb",
    "./Building (7).glb",
    "./Building (8).glb",
    "./Building (9).glb",
    "./Building (10).glb",
    "./Building (11).glb",
    "./Building (12).glb",
    "./Building (13).glb",
    "./Building (14).glb",
    "./Building (19).glb",
    "./Building (20).glb",
    "./Building (24).glb"

];


/* ============================================================
   5. TREE ASSETS
============================================================ */

const TREE_ASSETS = [

    "./Tree (2).glb",
    "./Tree (3).glb",
    "./Tree (4).glb",
    "./Tree (5).glb",
    "./Tree (6).glb",
    "./Tree (8).glb"

];


/* ============================================================
   6. ASSET CACHE
============================================================ */

const assetCache = new Map();


function loadGLB(url) {

    return new Promise((resolve, reject) => {

        if (assetCache.has(url)) {

            resolve(
                assetCache.get(url).clone(true)
            );

            return;

        }

        loader.load(

            url,

            gltf => {

                assetCache.set(
                    url,
                    gltf.scene
                );

                resolve(
                    gltf.scene.clone(true)
                );

            },

            undefined,

            error => {

                console.warn(
                    "Could not load:",
                    url,
                    error
                );

                reject(error);

            }

        );

    });

}


/* ============================================================
   7. MODEL NORMALIZATION
============================================================ */

function normalizeModel(
    model,
    targetSize = 4
) {

    const box =
        new THREE.Box3().setFromObject(model);

    const size =
        box.getSize(new THREE.Vector3());

    const maxDimension =
        Math.max(
            size.x,
            size.y,
            size.z
        );

    if (maxDimension > 0) {

        const scale =
            targetSize / maxDimension;

        model.scale.setScalar(scale);

    }

    const newBox =
        new THREE.Box3().setFromObject(model);

    const center =
        newBox.getCenter(
            new THREE.Vector3()
        );

    model.position.x -= center.x;
    model.position.z -= center.z;

    const minY =
        newBox.min.y;

    model.position.y -= minY;

    model.traverse(object => {

        if (object.isMesh) {

            object.castShadow = true;
            object.receiveShadow = true;

        }

    });

    return model;

}


/* ============================================================
   8. SCENE
============================================================ */

scene =
    new THREE.Scene();

scene.background =
    new THREE.Color(0x9ec7e9);

scene.fog =
    new THREE.FogExp2(
        0x9ec7e9,
        0.0025
    );


/* ============================================================
   9. CAMERA
============================================================ */

camera =
    new THREE.PerspectiveCamera(
        60,
        window.innerWidth /
        window.innerHeight,
        0.1,
        1200
    );

camera.position.set(
    0,
    5.5,
    10
);


/* ============================================================
   10. RENDERER
============================================================ */

renderer =
    new THREE.WebGLRenderer({
        antialias: true
    });

renderer.setSize(
    window.innerWidth,
    window.innerHeight
);

renderer.setPixelRatio(
    Math.min(
        window.devicePixelRatio,
        2
    )
);

renderer.shadowMap.enabled = true;

renderer.shadowMap.type =
    THREE.PCFSoftShadowMap;

renderer.toneMapping =
    THREE.ACESFilmicToneMapping;

renderer.toneMappingExposure = 1.15;

document.body.appendChild(
    renderer.domElement
);


/* ============================================================
   11. LIGHTING
============================================================ */

const hemisphere =
    new THREE.HemisphereLight(
        0xbddcff,
        0x3d5b35,
        1.5
    );

scene.add(hemisphere);


const sun =
    new THREE.DirectionalLight(
        0xfff2d5,
        2.5
    );

sun.position.set(
    60,
    100,
    -80
);

sun.castShadow = true;

sun.shadow.mapSize.width = 2048;
sun.shadow.mapSize.height = 2048;

sun.shadow.camera.near = 0.5;
sun.shadow.camera.far = 350;

sun.shadow.camera.left = -100;
sun.shadow.camera.right = 100;
sun.shadow.camera.top = 100;
sun.shadow.camera.bottom = -100;

scene.add(sun);


/* ============================================================
   12. TERRAIN
============================================================ */

const ROAD_WIDTH = 22;
const TILE_LENGTH = 100;
const TILE_COUNT = 15;

const roadTiles = [];
const grassTiles = [];


function terrainHeight(z) {

    return (
        Math.sin(z * 0.015) * 18 +
        Math.cos(z * 0.006) * 12
    );

}


function terrainSlope(z) {

    const d = 0.2;

    return (
        terrainHeight(z - d) -
        terrainHeight(z + d)
    ) / (2 * d);

}


const roadMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x303438,
        roughness: 0.82,
        metalness: 0.05
    });


const grassMaterial =
    new THREE.MeshStandardMaterial({
        color: 0x4d7c45,
        roughness: 0.95
    });


function createTerrainTile(
    width
) {

    const geometry =
        new THREE.PlaneGeometry(
            width,
            TILE_LENGTH,
            1,
            40
        );

    geometry.rotateX(
        -Math.PI / 2
    );

    return geometry;

}


function updateTerrain(
    mesh,
    startZ
) {

    const positions =
        mesh.geometry.attributes.position;

    for (
        let i = 0;
        i < positions.count;
        i++
    ) {

        const localZ =
            positions.getZ(i);

        const worldZ =
            startZ -
            localZ -
            TILE_LENGTH / 2;

        positions.setY(
            i,
            terrainHeight(worldZ)
        );

    }

    positions.needsUpdate = true;

    mesh.geometry.computeVertexNormals();

    mesh.position.z =
        startZ -
        TILE_LENGTH / 2;

}


for (
    let i = 0;
    i < TILE_COUNT;
    i++
) {

    const startZ =
        -i * TILE_LENGTH;


    const road =
        new THREE.Mesh(
            createTerrainTile(
                ROAD_WIDTH
            ),
            roadMaterial
        );

    road.receiveShadow = true;

    scene.add(road);

    updateTerrain(
        road,
        startZ
    );

    roadTiles.push(road);


    const grass =
        new THREE.Mesh(
            createTerrainTile(400),
            grassMaterial
        );

    grass.receiveShadow = true;

    scene.add(grass);

    updateTerrain(
        grass,
        startZ
    );

    grassTiles.push(grass);

}


/* ============================================================
   13. ROAD MARKINGS
============================================================ */

const roadMarkings = [];


function createRoadMark(
    x,
    z,
    width,
    color
) {

    const mesh =
        new THREE.Mesh(

            new THREE.PlaneGeometry(
                width,
                8
            ),

            new THREE.MeshBasicMaterial({
                color
            })

        );

    mesh.rotation.x =
        -Math.PI / 2;

    mesh.position.set(
        x,
        terrainHeight(z) + 0.05,
        z
    );

    mesh.userData.z = z;

    scene.add(mesh);

    roadMarkings.push(mesh);

}


for (
    let i = 0;
    i < 100;
    i++
) {

    const z =
        -i * 25;

    createRoadMark(
        -5,
        z,
        0.3,
        0xffc400
    );

    createRoadMark(
        5,
        z,
        0.3,
        0xffc400
    );

    createRoadMark(
        -10.5,
        z,
        0.35,
        0xffffff
    );

    createRoadMark(
        10.5,
        z,
        0.35,
        0xffffff
    );

}


/* ============================================================
   14. PLAYER
============================================================ */

playerGroup =
    new THREE.Group();

scene.add(
    playerGroup
);

playerGroup.position.set(
    0,
    0,
    0
);


async function loadPlayerCar(
    index
) {

    const asset =
        CAR_ASSETS[index];

    if (!asset) return;

    try {

        if (playerModel) {

            playerGroup.remove(
                playerModel
            );

        }

        const model =
            await loadGLB(
                asset.file
            );

        normalizeModel(
            model,
            4.5
        );

        model.rotation.y =
            Math.PI;

        playerModel =
            model;

        playerGroup.add(
            playerModel
        );

        modelReady = true;

    }
    catch (error) {

        console.error(
            "Player car failed:",
            asset.file
        );

    }

}


/* ============================================================
   15. GARAGE PREVIEW
============================================================ */

let previewScene;
let previewCamera;
let previewRenderer;
let previewModel;


function setupGaragePreview() {

    const container =
        document.getElementById(
            "garage-preview"
        );

    previewScene =
        new THREE.Scene();

    previewScene.background =
        new THREE.Color(
            0x091522
        );


    previewCamera =
        new THREE.PerspectiveCamera(
            45,
            container.clientWidth /
            container.clientHeight,
            0.1,
            100
        );

    previewCamera.position.set(
        5,
        3,
        6
    );


    previewRenderer =
        new THREE.WebGLRenderer({
            antialias: true,
            alpha: true
        });

    previewRenderer.setPixelRatio(
        Math.min(
            window.devicePixelRatio,
            2
        )
    );

    previewRenderer.setSize(
        container.clientWidth,
        container.clientHeight
    );

    container.appendChild(
        previewRenderer.domElement
    );


    const light =
        new THREE.HemisphereLight(
            0xffffff,
            0x182a3a,
            2
        );

    previewScene.add(light);


    const key =
        new THREE.DirectionalLight(
            0xffffff,
            3
        );

    key.position.set(
        5,
        8,
        5
    );

    previewScene.add(key);

}


async function updateGaragePreview() {

    const asset =
        CAR_ASSETS[
            selectedCarIndex
        ];

    document.getElementById(
        "selected-car-name"
    ).textContent =
        asset.name;

    document.getElementById(
        "selected-car-description"
    ).textContent =
        asset.description;

    document.getElementById(
        "car-counter"
    ).textContent =
        `${selectedCarIndex + 1} / ${CAR_ASSETS.length}`;


    if (previewModel) {

        previewScene.remove(
            previewModel
        );

    }

    try {

        previewModel =
            await loadGLB(
                asset.file
            );

        normalizeModel(
            previewModel,
            4.5
        );

        previewModel.rotation.y =
            Math.PI;

        previewScene.add(
            previewModel
        );

    }
    catch (error) {

        console.error(
            "Garage preview failed:",
            asset.file
        );

    }

}


function previousCar() {

    selectedCarIndex--;

    if (
        selectedCarIndex < 0
    ) {

        selectedCarIndex =
            CAR_ASSETS.length - 1;

    }

    updateGaragePreview();

}


function nextCar() {

    selectedCarIndex++;

    if (
        selectedCarIndex >=
        CAR_ASSETS.length
    ) {

        selectedCarIndex = 0;

    }

    updateGaragePreview();

}


/* ============================================================
   16. BUILDINGS
============================================================ */

const buildingModels = [];
const buildingObjects = [];


async function preloadBuildings() {

    for (
        const file of BUILDING_ASSETS
    ) {

        try {

            const model =
                await loadGLB(file);

            normalizeModel(
                model,
                12
            );

            buildingModels.push(
                model
            );

        }
        catch (error) {

            console.warn(
                "Building unavailable:",
                file
            );

        }

    }

}


function createBuilding(
    model,
    x,
    z,
    scale
) {

    const building =
        model.clone(true);

    building.scale.multiplyScalar(
        scale
    );

    building.position.x = x;
    building.position.z = z;

    building.position.y =
        terrainHeight(z);

    building.rotation.y =
        Math.random() *
        Math.PI *
        2;

    scene.add(
        building
    );

    buildingObjects.push(
        building
    );

}


function populateBuildings() {

    if (
        buildingModels.length === 0
    ) return;

    for (
        let i = 0;
        i < 35;
        i++
    ) {

        const z =
            -80 -
            i * 55;

        const leftModel =
            buildingModels[
                i %
                buildingModels.length
            ];

        const rightModel =
            buildingModels[
                (i + 5) %
                buildingModels.length
            ];

        createBuilding(
            leftModel,
            -27 - Math.random() * 8,
            z,
            0.7 +
            Math.random() * 0.5
        );

        createBuilding(
            rightModel,
            27 + Math.random() * 8,
            z - 25,
            0.7 +
            Math.random() * 0.5
        );

    }

}


/* ============================================================
   17. TREES
============================================================ */

const treeModels = [];
const treeObjects = [];


async function preloadTrees() {

    for (
        const file of TREE_ASSETS
    ) {

        try {

            const model =
                await loadGLB(file);

            normalizeModel(
                model,
                7
            );

            treeModels.push(
                model
            );

        }
        catch (error) {

            console.warn(
                "Tree unavailable:",
                file
            );

        }

    }

}


function populateTrees() {

    if (
        treeModels.length === 0
    ) return;

    for (
        let i = 0;
        i < 70;
        i++
    ) {

        const z =
            -40 -
            i * 28;

        const side =
            i % 2 === 0
                ? -1
                : 1;

        const x =
            side *
            (
                19 +
                Math.random() * 16
            );

        const model =
            treeModels[
                i %
                treeModels.length
            ].clone(true);

        const scale =
            0.65 +
            Math.random() *
            0.65;

        model.scale.multiplyScalar(
            scale
        );

        model.position.set(
            x,
            terrainHeight(z),
            z
        );

        model.rotation.y =
            Math.random() *
            Math.PI *
            2;

        scene.add(model);

        treeObjects.push(
            model
        );

    }

}


/* ============================================================
   18. TRAFFIC
============================================================ */

const traffic =
    [];

const lanes =
    [
        -7,
        -2.5,
        2.5,
        7
    ];


async function createTrafficCar(
    z,
    index
) {

    try {

        const file =
            TRAFFIC_ASSETS[
                index %
                TRAFFIC_ASSETS.length
            ];

        const model =
            await loadGLB(file);

        normalizeModel(
            model,
            4.2
        );

        const group =
            new THREE.Group();

        group.add(model);

        const lane =
            lanes[
                Math.floor(
                    Math.random() *
                    lanes.length
                )
            ];

        group.position.set(
            lane,
            terrainHeight(z),
            z
        );

        group.rotation.y =
            Math.PI;

        group.userData = {

            speed:
                0.10 +
                Math.random() *
                0.18,

            lane,

            width: 2.1,

            length: 4.2

        };

        scene.add(group);

        traffic.push(
            group
        );

    }
    catch (error) {

        console.warn(
            "Traffic asset unavailable"
        );

    }

}


async function createTraffic() {

    const promises = [];

    for (
        let i = 0;
        i < 10;
        i++
    ) {

        promises.push(
            createTrafficCar(
                -70 -
                i * 65,
                i
            )
        );

    }

    await Promise.all(
        promises
    );

}


/* ============================================================
   19. ROAD MOVEMENT
============================================================ */

function recycleRoadObjects() {

    const playerZ =
        playerGroup.position.z;


    for (
        const marking
        of roadMarkings
    ) {

        if (
            marking.position.z >
            playerZ + 30
        ) {

            marking.position.z -=
                2500;

        }

        marking.position.y =
            terrainHeight(
                marking.position.z
            ) + 0.05;

    }


    for (
        const grass
        of grassTiles
    ) {

        if (
            grass.position.z >
            playerZ + 250
        ) {

            grass.position.z -=
                TILE_COUNT *
                TILE_LENGTH;

        }

    }


    for (
        const road
        of roadTiles
    ) {

        if (
            road.position.z >
            playerZ + 250
        ) {

            road.position.z -=
                TILE_COUNT *
                TILE_LENGTH;

        }

    }

}


/* ============================================================
   20. CONTROLS
============================================================ */

const keys = {};


window.addEventListener(
    "keydown",
    event => {

        keys[
            event.key.toLowerCase()
        ] = true;

        if (
            [
                "arrowup",
                "arrowdown",
                "arrowleft",
                "arrowright",
                " "
            ].includes(event.key)
        ) {

            event.preventDefault();

        }

    }
);


window.addEventListener(
    "keyup",
    event => {

        keys[
            event.key.toLowerCase()
        ] = false;

    }
);


/* ============================================================
   21. PLAYER PHYSICS
============================================================ */

const MAX_SPEED = 1.05;
const ACCELERATION = 0.018;
const BRAKING = 0.035;
const DRAG = 0.008;

const STEERING_SPEED = 0.35;

let lateralVelocity = 0;


function updatePlayer() {

    if (
        !gameStarted ||
        gameOver ||
        !modelReady
    ) return;


    const accelerating =
        keys["w"] ||
        keys["arrowup"];

    const braking =
        keys["s"] ||
        keys["arrowdown"];


    if (accelerating) {

        speed +=
            ACCELERATION;

    }
    else {

        speed -=
            DRAG;

    }


    if (braking) {

        speed -=
            BRAKING;

    }


    speed =
        THREE.MathUtils.clamp(
            speed,
            0,
            MAX_SPEED
        );


    let steering = 0;


    if (
        keys["a"] ||
        keys["arrowleft"]
    ) {

        steering -= 1;

    }


    if (
        keys["d"] ||
        keys["arrowright"]
    ) {

        steering += 1;

    }


    lateralVelocity +=
        steering *
        STEERING_SPEED *
        0.12;


    lateralVelocity *=
        0.82;


    playerGroup.position.x +=
        lateralVelocity;


    playerGroup.position.x =
        THREE.MathUtils.clamp(
            playerGroup.position.x,
            -9,
            9
        );


    playerGroup.position.z -=
        speed;


    playerGroup.position.y =
        terrainHeight(
            playerGroup.position.z
        );


    const slope =
        terrainSlope(
            playerGroup.position.z
        );


    playerGroup.rotation.x =
        Math.atan(slope) *
        0.15;


    playerGroup.rotation.z =
        -lateralVelocity *
        0.08;


    distance +=
        speed * 0.8;

    score =
        Math.floor(
            distance
        );

}


/* ============================================================
   22. TRAFFIC PHYSICS
============================================================ */

function updateTraffic() {

    for (
        const car of traffic
    ) {

        car.position.z +=
            car.userData.speed -
            speed;


        car.position.y =
            terrainHeight(
                car.position.z
            );


        if (
            car.position.z >
            playerGroup.position.z +
            30
        ) {

            const furthest =
                Math.min(
                    ...traffic.map(
                        c => c.position.z
                    )
                );

            car.position.z =
                furthest -
                60 -
                Math.random() *
                80;

            car.userData.lane =
                lanes[
                    Math.floor(
                        Math.random() *
                        lanes.length
                    )
                ];

            car.position.x =
                car.userData.lane;

        }

    }

}


/* ============================================================
   23. COLLISION
============================================================ */

function checkCollisions() {

    if (
        !gameStarted ||
        gameOver
    ) return;


    const playerBox =
        new THREE.Box3()
            .setFromObject(
                playerGroup
            );

    playerBox.expandByScalar(
        -0.25
    );


    for (
        const car of traffic
    ) {

        const carBox =
            new THREE.Box3()
                .setFromObject(
                    car
                );

        carBox.expandByScalar(
            -0.15
        );


        if (
            playerBox.intersectsBox(
                carBox
            )
        ) {

            endGame();

            return;

        }

    }

}


/* ============================================================
   24. CAMERA
============================================================ */

function updateCamera() {

    const targetX =
        playerGroup.position.x;

    const targetZ =
        playerGroup.position.z;


    const desired =
        new THREE.Vector3(
            targetX * 0.35,
            terrainHeight(targetZ) + 5.5,
            targetZ + 10
        );


    camera.position.lerp(
        desired,
        0.08
    );


    const lookAt =
        new THREE.Vector3(
            targetX,
            terrainHeight(targetZ) + 1.2,
            targetZ - 12
        );


    camera.lookAt(
        lookAt
    );

}


/* ============================================================
   25. SPEEDOMETER
============================================================ */

const speedCanvas =
    document.getElementById(
        "speed-canvas"
    );

const speedCtx =
    speedCanvas.getContext(
        "2d"
    );


function drawSpeedometer() {

    const ctx =
        speedCtx;

    const w =
        speedCanvas.width;

    const h =
        speedCanvas.height;

    const cx =
        w / 2;

    const cy =
        h / 2;

    const radius =
        62;


    ctx.clearRect(
        0,
        0,
        w,
        h
    );


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0.75 * Math.PI,
        2.25 * Math.PI
    );

    ctx.lineWidth = 8;

    ctx.strokeStyle =
        "#273847";

    ctx.stroke();


    const kmh =
        Math.round(
            speed *
            160
        );


    const percentage =
        Math.min(
            kmh / 160,
            1
        );


    const angle =
        0.75 * Math.PI +
        percentage *
        1.5 * Math.PI;


    ctx.beginPath();

    ctx.arc(
        cx,
        cy,
        radius,
        0.75 * Math.PI,
        angle
    );

    ctx.lineWidth = 8;

    ctx.strokeStyle =
        percentage > 0.75
            ? "#ff4d4d"
            : "#35a7ff";

    ctx.stroke();


    ctx.save();

    ctx.translate(
        cx,
        cy
    );

    ctx.rotate(
        angle +
        Math.PI / 2
    );

    ctx.beginPath();

    ctx.moveTo(
        -3,
        0
    );

    ctx.lineTo(
        0,
        -radius + 12
    );

    ctx.lineTo(
        3,
        0
    );

    ctx.fillStyle =
        "#ffffff";

    ctx.fill();

    ctx.restore();


    ctx.fillStyle =
        "#ffffff";

    ctx.font =
        "900 21px Arial";

    ctx.textAlign =
        "center";

    ctx.fillText(
        kmh,
        cx,
        cy + 30
    );


    ctx.fillStyle =
        "#7891a5";

    ctx.font =
        "700 9px Arial";

    ctx.fillText(
        "KM/H",
        cx,
        cy + 43
    );

}


/* ============================================================
   26. HUD
============================================================ */

function updateHUD() {

    document.getElementById(
        "score-display"
    ).textContent =
        score.toString();


    document.getElementById(
        "distance-display"
    ).textContent =
        `${Math.floor(distance)}m`;


    drawSpeedometer();

}


/* ============================================================
   27. GAME START
============================================================ */

async function startGame() {

    if (!modelReady) {

        console.warn(
            "Player model is not ready."
        );

        return;

    }


    gameStarted = true;

    gameOver = false;

    speed = 0;

    score = 0;

    distance = 0;


    document.getElementById(
        "garage"
    ).style.display =
        "none";


    document.getElementById(
        "hud"
    ).style.display =
        "block";


    playerGroup.position.x =
        0;

    playerGroup.position.z =
        0;


    window.scrollTo(
        0,
        0
    );

}


/* ============================================================
   28. GAME OVER
============================================================ */

function endGame() {

    gameOver = true;

    speed = 0;


    document.getElementById(
        "final-score"
    ).textContent =
        score;


    document.getElementById(
        "game-over"
    ).style.display =
        "flex";


}


/* ============================================================
   29. RESET
============================================================ */

function resetGame() {

    document.getElementById(
        "game-over"
    ).style.display =
        "none";


    playerGroup.position.set(
        0,
        0,
        0
    );


    for (
        let i = 0;
        i < traffic.length;
        i++
    ) {

        traffic[i].position.z =
            -70 -
            i * 65;

    }


    speed = 0;

    score = 0;

    distance = 0;

    gameOver = false;

    gameStarted = true;

}


/* ============================================================
   30. RESIZE
============================================================ */

window.addEventListener(
    "resize",
    () => {

        camera.aspect =
            window.innerWidth /
            window.innerHeight;

        camera.updateProjectionMatrix();


        renderer.setSize(
            window.innerWidth,
            window.innerHeight
        );


        if (
            previewRenderer &&
            previewCamera
        ) {

            const container =
                document.getElementById(
                    "garage-preview"
                );

            previewCamera.aspect =
                container.clientWidth /
                container.clientHeight;

            previewCamera.updateProjectionMatrix();

            previewRenderer.setSize(
                container.clientWidth,
                container.clientHeight
            );

        }

    }
);


/* ============================================================
   31. MAIN GAME LOOP
============================================================ */

function animate() {

    requestAnimationFrame(
        animate
    );


    const delta =
        clock.getDelta();


    if (gameStarted) {

        updatePlayer();

        updateTraffic();

        checkCollisions();

        recycleRoadObjects();

        updateCamera();

        updateHUD();

    }


    if (
        previewRenderer &&
        previewScene &&
        previewCamera &&
        previewModel
    ) {

        previewModel.rotation.y +=
            delta * 0.35;

        previewRenderer.render(
            previewScene,
            previewCamera
        );

    }


    renderer.render(
        scene,
        camera
    );

}


/* ============================================================
   32. INITIALIZATION
============================================================ */

async function initializeGame() {

    const progress =
        document.getElementById(
            "loading-progress"
        );

    const status =
        document.getElementById(
            "loading-status"
        );


    try {

        status.textContent =
            "LOADING VEHICLES...";

        progress.style.width =
            "15%";


        /* Load first car */

        await loadPlayerCar(
            selectedCarIndex
        );


        progress.style.width =
            "35%";


        /* Garage preview */

        setupGaragePreview();

        await updateGaragePreview();


        progress.style.width =
            "50%";


        /* Buildings */

        status.textContent =
            "LOADING CITY...";

        await preloadBuildings();

        populateBuildings();


        progress.style.width =
            "68%";


        /* Trees */

        status.textContent =
            "LOADING VEGETATION...";

        await preloadTrees();

        populateTrees();


        progress.style.width =
            "82%";


        /* Traffic */

        status.textContent =
            "LOADING TRAFFIC...";

        await createTraffic();


        progress.style.width =
            "100%";


        status.textContent =
            "READY TO RACE";


        setTimeout(
            () => {

                const screen =
                    document.getElementById(
                        "loading-screen"
                    );

                screen.style.opacity =
                    "0";


                setTimeout(
                    () => {

                        screen.style.display =
                            "none";

                        document.getElementById(
                            "garage"
                        ).style.display =
                            "block";

                    },
                    600
                );

            },
            500
        );

    }
    catch (error) {

        console.error(
            "Initialization error:",
            error
        );

        status.textContent =
            "SOME ASSETS COULD NOT LOAD — CHECK CONSOLE";

    }

}


/* ============================================================
   33. START
============================================================ */

initializeGame();

animate();

</script>
